<title>Fußballkarriere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #0d1a13;
  --card: #15261c;
  --card2: #1c3325;
  --line: #2a4535;
  --text: #e8f1ea;
  --muted: #9bb3a3;
  --accent: #3ddc84;
  --accent-dark: #1f9d58;
  --gold: #e8c547;
  --silver: #c4ccd4;
  --bronze: #c88a4f;
  --red: #ef5b5b;
  --hover: #24402f;
  --danger-bg: #5a2323;
  --header-bg: rgba(0,0,0,.25);
  --on-accent: #ffffff;
  --board: #0a140e;
  --board-text: #e8f1ea;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

/* Helles Design: folgt dem System, außer es wurde ausdrücklich Dunkel gewählt */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eaf1ec; --card: #ffffff; --card2: #f1f6f2; --line: #d2ded6; --text: #13251a; --muted: #557062;
    --accent: #13824a; --accent-dark: #1b9654; --gold: #a87f00; --red: #c63737;
    --hover: #e1ece5; --danger-bg: #fbe3e3; --header-bg: rgba(255,255,255,.7); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eaf1ec; --card: #ffffff; --card2: #f1f6f2; --line: #d2ded6; --text: #13251a; --muted: #557062;
  --accent: #13824a; --accent-dark: #1b9654; --gold: #a87f00; --red: #c63737;
  --hover: #e1ece5; --danger-bg: #fbe3e3; --header-bg: rgba(255,255,255,.7); color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 60px, transparent 60px 120px);
  color: var(--text);
  line-height: 1.5;
}

.top {
  text-align: center;
  font-weight: 800;
  letter-spacing: .5px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--header-bg);
}

main { max-width: 760px; margin: 0 auto; padding: 16px; }

.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 16px; }

h1, h2, h3 { margin: 0 0 8px; line-height: 1.15; font-family: var(--font-display); font-weight: 700; text-wrap: balance; }
h1 { font-size: 2.6rem; letter-spacing: .5px; text-transform: uppercase; }
h2 { letter-spacing: .3px; }
.rating b, .score, .stats b, .top { font-family: var(--font-display); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
h2 { font-size: 1.5rem; }
h3 { font-size: 1rem; margin-top: 18px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

.card, .player, .hero {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
}

.hero { text-align: center; padding: 40px 20px; }
.hero.small { padding: 28px 20px; }
.hero h1 { font-size: 2.2rem; }
.ball { font-size: 56px; }
.lead { color: var(--muted); max-width: 520px; margin: 8px auto 20px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; justify-content: center; }
.choices { display: grid; gap: 10px; margin-top: 16px; }

.btn {
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 18px;
  cursor: pointer;
  transition: transform .08s, background .15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.98); }
.btn small { font-weight: 400; color: var(--muted); font-size: 12px; }
.btn.primary { background: var(--accent-dark); border-color: var(--accent); color: var(--on-accent); }
.btn.primary small { color: var(--on-accent); opacity: .85; }
.btn.primary:hover { background: var(--accent); }
.btn.danger { background: var(--danger-bg); border-color: var(--red); }
.btn.small { padding: 8px 12px; font-size: 14px; }

label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 14px; }
input, select {
  display: block;
  width: 100%;
  margin-top: 4px;
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.err { color: var(--red); min-height: 1em; margin: 0; }

.stars { color: var(--gold); letter-spacing: 2px; }

.offers { display: grid; gap: 10px; }
.offer {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}
.offer-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.offer-info small { color: var(--muted); }

.crest {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.25);
  vertical-align: middle;
}

/* Spielerkarte */
.player { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.player .bars { grid-column: 1 / -1; display: grid; gap: 6px; }
.rating {
  width: 72px;
  height: 84px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #1a1a1a;
}
.rating b { font-size: 2rem; line-height: 1; }
.rating small { font-weight: 700; }
.rating.gold { background: linear-gradient(160deg, #f6e27a, var(--gold)); }
.rating.silver { background: linear-gradient(160deg, #eef1f4, var(--silver)); }
.rating.bronze { background: linear-gradient(160deg, #e5b17d, var(--bronze)); }
.pinfo h2 { margin-bottom: 2px; }
.pinfo p { margin: 0; color: var(--muted); font-size: 14px; }
.pinfo .clubline { color: var(--text); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.num { color: var(--muted); font-weight: 400; }

.bar { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; }
.bar.form .fill { background: linear-gradient(90deg, var(--red), var(--gold), var(--accent)); }

/* Saison */
.stephead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.done { background: var(--accent-dark); }
.dot.now { background: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,132,.25); }

.facts { list-style: none; padding: 0; margin: 12px 0 0; }
.facts li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.facts span { color: var(--muted); }
.facts b { text-align: right; }

.result { background: var(--card2); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
.result p { margin: 4px 0; }
.chosen { color: var(--muted); font-size: 13px; }
.note { background: var(--card2); border-radius: 10px; padding: 8px 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.chip.up { background: rgba(61,220,132,.15); color: var(--accent); }
.chip.down { background: rgba(239,91,91,.15); color: var(--red); }

.scoreboard { background: var(--board); color: var(--board-text); border-radius: 12px; padding: 12px; text-align: center; }
.comp { color: var(--gold); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.score { font-size: 2rem; font-weight: 800; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.score small { font-size: 12px; color: var(--muted); font-weight: 400; }
.situation { font-size: 1.05rem; margin-top: 14px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.stats div { background: var(--card2); border-radius: 10px; padding: 10px; text-align: center; display: flex; flex-direction: column; }
.stats b { font-size: 1.5rem; }
.stats span { color: var(--muted); font-size: 12px; }
.up { color: var(--accent); font-style: normal; }
.down { color: var(--red); font-style: normal; }

.lines { padding-left: 18px; margin: 6px 0; }
.lines li { margin: 3px 0; }

details summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
details.table { margin-top: 14px; }
details.table ol { list-style: none; padding: 0; margin: 8px 0 0; counter-reset: pos; }
details.table li { counter-increment: pos; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; font-size: 14px; }
details.table li::before { content: counter(pos) "."; width: 26px; color: var(--muted); text-align: right; }
details.table li span { flex: 1; }
details.table li.me { background: rgba(61,220,132,.15); font-weight: 700; }
details.table .crest { width: 22px; height: 22px; font-size: 9px; }

.scroll { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.club { text-align: left; }

@media (max-width: 480px) {
  main { padding: 12px; }
  .hero h1 { font-size: 1.8rem; }
  .team span { font-size: 12px; }
  .score { font-size: 1.6rem; }
}

/* Vermögen & Vertrag */
.wallet { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wallet div { background: var(--card2); border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; }
.wallet span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.wallet b { font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts.money li.sum { border-bottom: none; font-size: 1.05rem; }
.facts.money b { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.shop { display: grid; gap: 14px; margin-top: 10px; }
.shopcat h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.shopitem { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.shopitem > div:first-child { display: flex; flex-direction: column; min-width: 0; }
.shopitem small { color: var(--muted); }
.shopbtns { display: flex; gap: 6px; flex-shrink: 0; }
.owned { color: var(--accent); font-size: 13px; font-weight: 600; }
.btn.disabled { opacity: .4; cursor: not-allowed; }

/* Trainingsschwerpunkt */
.focus { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.focus .btn { align-items: flex-start; text-align: left; padding: 10px 12px; }
.focus .btn small { font-size: 12px; }
.btn.chosen-focus { border-color: var(--accent); background: rgba(61,220,132,.14); box-shadow: inset 0 0 0 1px var(--accent); }

/* Privatleben */
.partner { display: grid; gap: 6px; background: var(--card2); border-radius: 12px; padding: 10px 12px; }
.partner > div:first-child { display: flex; flex-direction: column; }
.partner small { color: var(--muted); }
.lifeacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.lifeacts .btn { align-items: flex-start; text-align: left; }
.btn.risky { border-color: var(--red); }
.card.banned { border-color: var(--red); }

/* Familie, Mannschaft, Legenden */
.people { display: grid; gap: 10px; }
.person { display: grid; gap: 6px; background: var(--card2); border-radius: 12px; padding: 10px 12px; }
.person > div:first-child { display: flex; flex-direction: column; gap: 4px; }
.person small, .legend small, small.sub { color: var(--muted); display: block; font-size: 12px; }
.person .lifeacts { margin-top: 0; }
.legend { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.legend > div { min-width: 0; }
.coachcard .rating small { font-size: 11px; }

/* Übersicht: Reiter, Tipps, Hilfe */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.helpbtn { font: inherit; font-size: 14px; font-weight: 700; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.helpbtn:hover { border-color: var(--accent); }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.btn.tab { padding: 8px 2px; border-radius: 12px; font-size: 12px; gap: 2px; min-width: 0; }
.btn.tab .ti { font-size: 20px; line-height: 1.1; }
.btn.tab.active { background: var(--accent-dark); border-color: var(--accent); color: var(--on-accent); }
.tip { background: rgba(232,197,71,.1); border: 1px solid rgba(232,197,71,.4); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.tip b { color: var(--gold); }
.tip p { margin: 4px 0 6px; }
.btn.link { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; font-weight: 400; font-size: 13px; }
.help h3 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 1.05rem; margin-top: 0; }
.helpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.helpgrid > div { background: var(--card2); border-radius: 12px; padding: 12px 14px; }
.helpgrid p { margin: 0; color: var(--muted); }
.steps { list-style: none; counter-reset: st; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; align-items: start; }
.steps li::before { content: counter(st); grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--on-accent); }
.steps span { color: var(--muted); }
.lines.big li { font-size: 1.05rem; margin: 6px 0; }
.moneyline { background: var(--card2); border-radius: 10px; padding: 8px 12px; }
details.more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
.tag.good { background: rgba(61,220,132,.15); color: var(--accent); }
.tag.bad { background: rgba(239,91,91,.15); color: var(--red); }
.rolechip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--text); }

/* Spielstände, Ziele, Erfolge, Diagramm, Einblendungen */
.hbtns { display: flex; gap: 6px; }
.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.slotnum { width: 30px; height: 30px; border-radius: 50%; background: var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.slotwarn { grid-column: 1 / -1; margin: 0; color: var(--red); font-size: 13px; }
.goals { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.goals li { background: var(--card2); border-radius: 10px; padding: 8px 12px; }
.goals li.ok { box-shadow: inset 3px 0 0 var(--accent); }
.goals li.fail { box-shadow: inset 3px 0 0 var(--red); }
.small { font-size: 13px; }
.achs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.ach { background: var(--card2); border-radius: 10px; padding: 8px 10px; opacity: .55; display: flex; flex-direction: column; }
.ach.got { opacity: 1; box-shadow: inset 0 0 0 1px var(--gold); }
.ach small { color: var(--muted); }
.sharebox { width: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
#toasts { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--card); color: var(--text); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); animation: toastIn .3s ease-out; font-weight: 600; }
@keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.chart { width: 100%; max-width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .gbar { fill: var(--gold); opacity: .55; }
.chart .rline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart .rarea { fill: var(--accent); opacity: .12; }
.chart .rpeak { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.lg { display: inline-block; width: 12px; height: 4px; border-radius: 2px; vertical-align: middle; }
.lg-r { background: var(--accent); }
.lg-g { background: var(--gold); height: 10px; opacity: .55; }
.rehabbar { display: flex; gap: 8px; margin: 10px 0; }
.rehabbar span { width: 32px; height: 32px; border-radius: 50%; background: var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.rehabbar span.done { background: var(--accent-dark); color: var(--on-accent); }
.rehabbar span.now { box-shadow: 0 0 0 3px var(--accent); }
@media (max-width: 420px) { .slot { grid-template-columns: 30px 1fr; } .slot .shopbtns { grid-column: 1 / -1; justify-content: flex-end; } .top > span:first-child { font-size: 15px; } .helpbtn { padding: 6px 10px; } }

/* Live-Finale, Schlagzeile, Rückblick */
.card.final { border-color: var(--gold); }
.anthem { font-style: italic; color: var(--gold); margin: 12px 0 0; }
.ticker { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; font-size: 14px; font-variant-numeric: tabular-nums; }
.ticker li { background: var(--card2); border-radius: 8px; padding: 4px 10px; }
.newspaper { background: #f4efe2; color: #1b1b1b; border-radius: 6px; padding: 12px 16px 14px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.25); transform: rotate(-0.6deg); }
.newspaper .paper { font-family: var(--font-display); font-size: 12px; letter-spacing: 2px; border-bottom: 2px solid #1b1b1b; padding-bottom: 4px; margin-bottom: 6px; color: #b3261e; font-weight: 800; }
.newspaper .headline { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; text-transform: uppercase; text-wrap: balance; }
.pop { animation: popIn .45s ease-out both; }
@keyframes popIn { from { transform: translateY(8px) scale(.97); opacity: .2; } to { transform: none; opacity: 1; } }
.daily { border-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .newspaper { transform: none; } }

/* Saison-Rückblick im Video-Stil (bewusst immer dunkel wie ein Video) */
.recap-overlay {
  position: fixed; inset: 0; z-index: 60; color: #fff;
  background: radial-gradient(circle at 50% 30%, #1f5a3a 0%, #0b1a12 55%, #050b08 100%);
  display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.rc-bars { display: flex; gap: 4px; margin-right: 44px; }
.rc-bars span { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
.rc-bars span i { display: block; height: 100%; width: 0; background: #fff; }
.rc-bars span.done i { width: 100%; }
.rc-bars span.now i { animation: rcFill var(--dur, 3400ms) linear forwards; }
.rc-bars span.now.paused i { animation: none; width: 100%; opacity: .6; }
@keyframes rcFill { from { width: 0; } to { width: 100%; } }
.rc-close { position: absolute; top: calc(4px + env(safe-area-inset-top, 0px)); right: 12px; width: 40px; height: 40px; border: none; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; cursor: pointer; }

const fmt1 = n => n.toFixed(1).replace('.', ',');
const fmt2 = n => n.toFixed(2).replace('.', ',');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const leagueById = id => LEAGUES.find(l => l.id === id);
const clubStr = name => clamp(Math.round(S.clubs[name].base + S.clubs[name].drift), 40, 95);
const clubLeague = name => leagueById(S.clubs[name].league);
const clubsIn = id => Object.keys(S.clubs).filter(n => S.clubs[n].league === id);
const nation = () => NATIONS.find(n => n.name === S.player.nation);
const confOf = L => L.conf || 'UEFA';
const euroName = (club = S.clubId, comp = S.europe) => comp ? CLUB_COMPS[confOf(clubLeague(club))][comp] : null;

function marketValue(p = S.player) {
  const ageF = p.age <= 23 ? 1.3 : p.age <= 27 ? 1.1 : p.age <= 30 ? 0.8 : p.age <= 32 ? 0.5 : 0.25;
  return Math.min(250, 5 * Math.exp((p.rating - 70) / 5.9) * ageF);
}
function money(mio) {
  const neg = mio < 0 ? '−' : '';
  const a = Math.abs(mio);
  if (a < 1) return `${neg}${Math.max(1, Math.round(a * 1000))} Tsd. €`;
  return `${neg}${a < 10 ? fmt1(a) : Math.round(a)} Mio. €`;
}

// Jahresgehalt (brutto, Mio. €) je nach Stärke, Liga und Rolle
function salaryFor(rating, club, role) {
  const wage = LEAGUE_WAGE[S.clubs[club].league] || 0.5;
  const roleF = { 'Stammspieler': 1, 'Rotation': 0.8, 'Ergänzungsspieler': 0.65 }[role] || 0.8;
  return Math.max(0.03, 0.08 * Math.exp((rating - 60) / 6.5) * wage * roleF);
}
function sponsorIncome() {
  const p = S.player;
  return clamp(Math.pow(p.popularity / 100, 2) * 0.4 * Math.exp((p.rating - 70) / 7), 0, 40);
}
function ownedCount(id) { return (S.owned && S.owned[id]) || 0; }

function crest(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  const words = name.replace(/[0-9.]/g, '').split(/\s+/).filter(w => w.length > 2 && !['FC', 'SC', 'SV', 'AC', 'AS', 'CF'].includes(w));
  const ini = (words[0] || name)[0] + ((words[1] || '')[0] || '');
  return `<span class="crest" style="background:hsl(${h} 55% 38%)">${esc(ini.toUpperCase())}</span>`;
}

const STAT_LABELS = {
  form: 'Form', trust: 'Vertrauen', popularity: 'Beliebtheit', injuryProne: 'Verletzungsrisiko',
  devBonus: 'Entwicklung', injuredGames: 'Ausfall (Spiele)', goals: 'Tore', assists: 'Vorlagen', money: 'Vermögen', rel: 'Beziehung',
};
function mod(changes) {
  const p = S.player, se = S.season;
  const parts = [];
  for (const [k, v] of Object.entries(changes)) {
    if (!v) continue;
    if (k === 'form') p.form = clamp(p.form + v, -10, 10);
    else if (k === 'trust') p.trust = clamp(p.trust + v, 0, 100);
    else if (k === 'popularity') p.popularity = clamp(p.popularity + v, 0, 100);
    else if (k === 'injuryProne') p.injuryProne = clamp(p.injuryProne + v, 0, 40);
    else if (k === 'devBonus') se.devBonus += v;
    else if (k === 'injuredGames') se.injuredGames += v;
    else if (k === 'goals') se.extraGoals += v;
    else if (k === 'assists') se.extraAssists += v;
    else if (k === 'money') S.money += v;
    else if (k === 'rel') { if (!life().partner) continue; life().partner.rel = clamp(life().partner.rel + v, 0, 100); }
    const good = k === 'injuryProne' || k === 'injuredGames' ? v < 0 : v > 0;
    const shown = k === 'devBonus' ? (v > 0 ? '▲' : '▼') : k === 'money' ? (v > 0 ? '+' : '−') + money(Math.abs(v)) : (v > 0 ? '+' : '−') + Math.abs(v);
    parts.push(`<span class="chip ${good ? 'up' : 'down'}">${STAT_LABELS[k]} ${shown}</span>`);
  }
  return parts.length ? `<div class="chips">${parts.join('')}</div>` : '';
}

}

}

function newGame(name, nationName, pos, number, heir = null, difficulty = 'normal') {
  let clubs = {};
  if (heir) clubs = heir.clubs;
  else for (const L of LEAGUES) for (const [n, str] of L.clubs) clubs[n] = { league: L.id, base: str, drift: 0 };
  const potential = clamp(Math.round(72 + Math.pow(Math.random(), 0.8) * 26) + (heir ? heir.talent : 0), 70, 99);
  S = {
    player: {
      name, nation: nationName, pos, number, age: 17,
      rating: randInt(48, 55), potential, form: 0, trust: 50, popularity: 20, injuryProne: 8, caps: 0, intGoals: 0,
    },
    year: START_YEAR, clubs, clubId: null, loan: null, youth: true, captainAt: null,
    lastTables: {}, phase: 'academy', current: null, season: null, seasonEnd: null, offers: null,
    history: [], titles: [], awards: [], clubsPlayed: [], peak: 0,
    scoutGuess: clamp(potential + randInt(-5, 5), 60, 99),
    money: 0.005, earned: 0, contract: { salary: 0.015, years: 1 }, owned: {},
  };
  if (heir) {
    // Die nächste Generation erbt Vermögen, Besitz, Bekanntheit und etwas Talent
    Object.assign(S, {
      year: heir.year, lastTables: heir.lastTables, money: heir.money, owned: heir.owned,
      dynasty: heir.dynasty, gen: heir.gen, parentName: heir.parentName,
    });
    S.player.popularity = clamp(20 + heir.fame, 0, 100);
    if (heir.talent >= 3) S.player.rating += 2;
  }
  S.slot = heir ? heir.slot : pendingSlot;
  S.diff = heir ? heir.diff : difficulty;
  const d = diff();
  S.player.rating += d.rating;
  S.player.potential = clamp(S.player.potential + d.potential, 65, 99);
  S.player.injuryProne = d.injury;
  S.peak = S.player.rating;
  S.academyOffers = academyOffers();
  initRival();
  initFamily(heir);
}

function startHeir(child) {
  const t = totals();
  const record = {
    name: S.player.name, gen: S.gen || 1, peak: S.peak, titles: S.titles.length, games: t.games, goals: t.goals,
    ballon: S.awards.filter(a => a.startsWith("Ballon d'Or")).length, money: S.money,
  };
  const surname = S.player.name.trim().split(/\s+/).slice(-1)[0];
  const heir = {
    childName: child.name, surname, nation: S.player.nation, parentName: S.player.name,
    year: Math.max(S.year + 1, child.born + 17), clubs: S.clubs, lastTables: S.lastTables,
    money: S.money, owned: S.owned, dynasty: [...(S.dynasty || []), record], gen: (S.gen || 1) + 1,
    fame: clamp(Math.round((S.peak - 70) * 1.2 + S.titles.length), 0, 45),
    talent: clamp(Math.round((S.peak - 75) / 3), -2, 6),
    parentState: S, slot: S.slot, diff: S.diff,
    family: {
      parents: [
        { role: 'Elternteil', name: S.player.name, age: S.player.age, alive: true, rel: 80 },
        ...(life().partner ? [{ role: 'Elternteil', name: life().partner.name, age: S.player.age + randInt(-3, 3), alive: true, rel: 80 }] : []),
      ],
      siblings: life().children.filter(c => c !== child).map(c => ({
        name: c.name, brother: BROTHER_NAMES.includes(c.name) || !SISTER_NAMES.includes(c.name),
        age: Math.max(S.year + 1, child.born + 17) - c.born, footballer: chance(0.3), rating: randInt(45, 56), club: null, rel: 70,
      })),
    },
  };
  S = { phase: 'create', heir };
}

function academyOffers() {
  const home = nation().country;
  const all = Object.keys(S.clubs).filter(n => clubStr(n) >= 68);
  const domestic = shuffle(all.filter(n => clubLeague(n).country === home));
  const foreign = shuffle(all.filter(n => clubLeague(n).country !== home));
  const picks = [...domestic.slice(0, home ? 2 : 0), ...foreign].slice(0, 3);
  return picks.sort((a, b) => clubStr(b) - clubStr(a));
}

function life() {
  if (!S.life) S.life = { partner: null, married: false, children: [], exes: 0 };
  const l = S.life;
  // Spielstände aus älteren Versionen umwandeln
  if (typeof l.partner === 'string') l.partner = { name: l.partner, rel: 60, job: pick(JOBS) };
  if (!l.children) {
    l.children = [];
    for (let i = 0; i < (l.kids || 0); i++) l.children.push({ name: pick(CHILD_NAMES), born: S.year - i });
    delete l.kids;
  }
  if (l.exes === undefined) l.exes = 0;
  return l;
}
function lifeText() {
  const l = life();
  let t = !l.partner ? 'Single' : l.married ? `Verheiratet mit ${l.partner.name}` : `In einer Beziehung mit ${l.partner.name}`;
  if (l.children.length) t += `, ${l.children.length} ${l.children.length === 1 ? 'Kind' : 'Kinder'}`;
  return t;
}
function haveChild() {
  const l = life();
  const used = l.children.map(c => c.name);
  const name = pick(CHILD_NAMES.filter(n => !used.includes(n)));

function breakUp() {
  const l = life();

  let text = `Du und ${name} geht ab jetzt getrennte Wege.`;
  if (l.married) {

    S.money -= loss;
    text = `Scheidung von ${name}. Die Anwälte und der Unterhalt kosten dich ${money(loss)}.`;
  }
  l.partner = null; l.married = false; l.exes++;
  return text;
}

function startSeason() {
  const p = S.player;
  const str = clubStr(S.clubId);
  const role = S.youth ? 'U19' : roleFor(p.rating, str, p.trust);
  S.season = { role, focus: 'balanced', devBonus: 0, injuredGames: 0, extraGoals: 0, extraAssists: 0, usedEvents: [], transferBoost: 0, scenes: [], step: 0 };
  genSeasonGoals();
  S.europe = S.youth ? null : europeFor(S.clubId);
  S.phase = 'preseason';
  S.current = null;
  S.lifeMsg = null; S.peopleMsg = null; S.bizMsg = null;
  if (!S.clubsPlayed.includes(S.clubId)) S.clubsPlayed.push(S.clubId);
  if (!S.youth) ensureTeam();
}

function europeFor(club) {
  const L = clubLeague(club);
  const table = S.lastTables[L.id] || clubsIn(L.id).sort((a, b) => clubStr(b) - clubStr(a));
  const idx = table.indexOf(club);
  if (idx < 0) return null;
  const C = CLUB_COMPS[confOf(L)];
  if (idx < L.cl) return 'cl';
  if (C.el && idx < L.cl + L.el) return 'el';
  return null;
}

function nextStep() {
  const se = S.season;
  if (se.step === 0) S.headline = null;
  if (se.step >= STEPS.length) { endSeason(); return; }
  const step = STEPS[se.step];
  if (step.type === 'event') setupEvent(); else setupMatch();
  S.phase = 'season';
}

function setupEvent() {
  if (maybeSeriousInjury()) return;
  const pool = EVENTS.filter(e => !S.season.usedEvents.includes(e.id) && (!e.cond || e.cond()));
  const total = pool.reduce((s, e) => s + (e.weight ? e.weight() : 1), 0);
  let r = Math.random() * total, ev = pool[0];
  for (const e of pool) { r -= e.weight ? e.weight() : 1; if (r <= 0) { ev = e; break; } }
  S.season.usedEvents.push(ev.id);
  S.current = { type: 'event', id: ev.id, ctx: {}, result: null };
  S.current.text = ev.text(); // Text einmal festhalten (Zufallswerte stabil)
}

function setupMatch() {
  const p = S.player, se = S.season;
  const own = S.clubId;
  const L = clubLeague(own);
  let comp = L.name, opp;
  const matchNo = STEPS.slice(0, se.step).filter(st => st.type === 'match').length; // 0, 1, 2
  if (S.youth) {
    comp = 'U19-Liga';
    opp = pick(clubsIn(L.id).filter(n => n !== own));
  } else if (matchNo === 1 && S.europe && chance(0.65)) {
    comp = euroName();
    const pool = euroPool(own, S.europe).sort((x, y) => y.str - x.str);
    opp = pick(pool.slice(0, Math.max(3, Math.ceil(pool.length / 3)))).name;
  } else if (matchNo === 1) {
    comp = L.cup;
    opp = pick(Object.keys(S.clubs).filter(n => n !== own && clubLeague(n).country === L.country));
  } else {
    const others = clubsIn(L.id).filter(n => n !== own).sort((a, b) => clubStr(b) - clubStr(a));
    opp = pick(others.slice(0, 6));
  }
  let drama = null;
  if (matchNo === 2) {
    drama = finalDayDrama();
    if (drama) {
      comp = L.name;
      const others = clubsIn(L.id).filter(n => n !== own);
      opp = pick(others);
      S.season.drama = { type: drama.type };
    }
  }
  let rivalMatch = false;
  if (!drama && !S.youth && rivalActive() && S.rival.club !== own && clubLeague(S.rival.club).id === L.id && comp === L.name && chance(0.4)) {
    opp = S.rival.club;
    rivalMatch = true;
  }
  const home = chance(0.5);
  const minute = randInt(62, 89);
  const a = randInt(0, 2);
  const b = clamp(a + randInt(-1, 1), 0, 3);
  const scene = pick(SCENES[POSITIONS[p.pos].group])(quality());
  S.current = {
    type: 'match', ctx: {}, result: null, comp, opp, home, minute, a, b, rivalMatch,
    drama: !!drama,
    situation: (drama ? drama.text : '') + (comp === 'Champions League' ? '🎶 Die Champions-League-Hymne ist verklungen, das Flutlicht strahlt. ' : '')
      + (rivalMatch ? `Duell mit deinem Rivalen ${S.rival.name}! ` : '') + scene.situation,
    options: scene.options.map(o => ({ ...o, p: o.p !== undefined ? clamp(o.p, 0.05, 0.92) : undefined })),
  };
}

function quality() {
  const p = S.player;
  return clamp((p.rating - 50) / 40 + p.form / 40, 0, 1.2);
}

function resolveMatch(i) {
  const c = S.current, o = c.options[i], p = S.player;
  let us = c.a, them = c.b, text, eff;
  if (o.kind === 'shoot') {
    const keeper = randInt(0, 2);
    const scored = keeper !== o.dir ? chance(0.9 + quality() * 0.08) : chance(0.12 + quality() * 0.12);
    if (scored) { us++; text = `TOOOR! ${keeper === 1 ? 'Der Torwart bleibt in der Mitte stehen' : `Der Torwart springt nach ${keeper === 0 ? 'links' : 'rechts'}`} – du verwandelst eiskalt ${['links unten', 'in die Mitte', 'rechts oben'][o.dir]}.${celebrationText()} Endstand ${us}:${them}.`; eff = { form: 3, trust: 3, popularity: 4, goals: 1 }; }
    else { text = `${keeper === o.dir ? 'Der Torwart ahnt die Ecke und hält!' : 'Du schießt am Tor vorbei!'} Endstand ${us}:${them}.`; eff = { form: -2, trust: -2, popularity: -2 }; }
  } else if (o.kind === 'save') {
    const shot = randInt(0, 2);
    const saved = shot === o.dir ? chance(0.55 + quality() * 0.3) : chance(0.04 + quality() * 0.06);
    if (saved) {
      text = shot === o.dir
        ? `Gehalten! Du ahnst die Ecke und parierst. Ihr bringt das ${us}:${them} über die Zeit.`
        : `Du springst in die falsche Ecke – aber der Schütze trifft nur den Pfosten! Glück gehabt, es bleibt beim ${us}:${them}.`;
      eff = { form: 3, trust: 3, popularity: 5 };
    } else {
      them++;
      text = shot === o.dir
        ? `Du bist in der richtigen Ecke, aber der Schuss ist zu scharf. Endstand ${us}:${them}.`
        : `Du springst in die falsche Ecke, der Ball schlägt ${['links', 'in der Mitte', 'rechts'][shot]} ein. Endstand ${us}:${them}.`;
      eff = { form: -1 };
    }
  } else {
    const ok = chance(o.p);
    if (o.kind === 'goal') {
      if (ok) { us++; text = `TOOOR! ${o.okText || 'Du triffst!'}${o.bonus ? ' Das Stadion bebt!' : ''}${celebrationText()} Endstand ${us}:${them}.`; eff = { form: 3, trust: 3, popularity: o.bonus ? 7 : 4, goals: 1 }; }
      else { text = `${o.failText || 'Knapp vorbei!'} Endstand ${us}:${them}.`; eff = { form: -1, trust: o.bonus ? -3 : -1 }; }
    } else if (o.kind === 'assist') {
      if (ok) { us++; text = `${o.okText || 'Perfekter Pass – dein Mitspieler schiebt ein!'} Endstand ${us}:${them}.`; eff = { form: 2, trust: 4, popularity: 3, assists: 1 }; }
      else { text = `${o.failText || 'Der Pass wird abgefangen.'} Endstand ${us}:${them}.`; eff = { form: -1 }; }
    } else if (o.kind === 'safe') {
      if (ok) { text = `${o.okText || 'Clever gespielt. Ihr kontrolliert das Spiel.'} Endstand ${us}:${them}.`; eff = { trust: 2 }; }
      else { them++; text = `${o.failText || 'Ballverlust – Gegentor!'} Endstand ${us}:${them}.`; eff = { form: -2, trust: -3 }; }
    } else if (o.kind === 'stop') {
      if (ok) { text = `${o.okText || 'Ball erobert! Die Fans feiern deine Rettungstat.'} Endstand ${us}:${them}.`; eff = { form: 2, trust: 4, popularity: o.risky ? 5 : 3 }; }
      else if (o.risky && chance(0.35)) { them++; text = `Zu spät! Rote Karte und Elfmeter – ${us}:${them}. Du bist für 3 Spiele gesperrt.`; eff = { form: -3, trust: -5, injuredGames: 3 }; }
      else { them++; text = `${o.failText || 'Nicht zu verhindern – der Ball ist drin.'} Endstand ${us}:${them}.`; eff = { form: -2, trust: -2 }; }
    } else {
      if (ok) { text = `Gelbe Karte – aber der Konter ist gestoppt. Endstand ${us}:${them}.`; eff = { trust: 1 }; }
      else { text = `Der Schiri zeigt Rot! Du fliegst vom Platz. Endstand ${us}:${them}.`; eff = { trust: -4, injuredGames: 2 }; }
    }
  }
  const resultWord = us > them ? 'Sieg' : us < them ? 'Niederlage' : 'Unentschieden';
  S.season.scenes.push(`${c.comp}: ${resultWord} gegen ${c.opp} (${us}:${them})`);
  c.final = c.home ? `${us}:${them}` : `${them}:${us}`;
  c.chosen = i;
  queueFx(us > c.a ? 'goal' : 'whistle');
  if (c.drama && S.season.drama) {
    const d = S.season.drama;
    d.won = us > them;
    const msg = {
      relegation: ['Klassenerhalt! Die Fans stürmen den Platz!', 'Abgestiegen. Spieler liegen weinend auf dem Rasen.'],
      promotion: ['AUFSTIEG! Die Stadt steht kopf!', 'Der Aufstieg ist verpasst. So nah dran …'],
      title: ['MEISTER! Die Schale gehört euch!', 'Die Meisterschaft ist weg – ein anderer jubelt.'],
    }[d.type];
    text += ` ${d.won ? msg[0] : msg[1]}`;
    if (d.won) { queueFx('fanfare', 'confetti'); S.player.popularity = clamp(S.player.popularity + 5, 0, 100); }
  }
  if (c.comp === 'Champions League' && us > them) S.player.popularity = clamp(S.player.popularity + 2, 0, 100);
  if (c.rivalMatch) {
    if (us > them) { S.rival.wins++; text += ` Du gewinnst das Duell gegen ${S.rival.name}!`; }
    else if (us < them) { S.rival.losses++; text += ` ${S.rival.name} grinst nach dem Spiel in die Kameras.`; }
  }
  c.result = `<p>${text}</p>` + mod(eff);
}

// ---------- Saisonende ----------
function simLeague(id, bonusClub, bonus) {
  const clubs = clubsIn(id);
  const strs = clubs.map(clubStr);
  const min = Math.min(...strs), max = Math.max(...strs);
  const games = (clubs.length - 1) * 2;
  const rows = clubs.map((n, i) => {
    let ppg = 0.5 + ((strs[i] - min) / Math.max(1, max - min)) * 1.75 + gauss() * 0.22;
    if (n === bonusClub) ppg += bonus;
    return { name: n, pts: Math.round(clamp(ppg, 0.3, 2.75) * games), r: Math.random() };
  });
  rows.sort((a, b) => b.pts - a.pts || a.r - b.r);
  return { rows, games };
}

function knockout(ownStr, rounds, pool, k = 5, firstEasy = false) {
  const sorted = pool.slice().sort((a, b) => b.str - a.str);
  for (let i = 0; i < rounds.length; i++) {
    const topN = Math.max(2, Math.ceil(sorted.length * (1 - i / rounds.length)));
    const opp = pick(sorted.slice(0, topN));
    let pw = sigmoid((ownStr - opp.str) / k);
    if (i === 0 && firstEasy) pw = Math.max(pw, 0.7);
    if (!chance(pw)) return { won: false, reached: rounds[i], lostTo: opp.name, played: i + 1 };
    if (i === rounds.length - 1) return { won: true, reached: rounds[i], beat: opp.name, played: i + 1 };
  }
}

function endSeason() {
  const p = S.player, se = S.season;
  const own = S.clubId, L = clubLeague(own), str = clubStr(own);
  const youth = S.youth;
  const res = { year: S.year, age: p.age, club: own, league: youth ? 'U19-Liga' : L.name, role: se.role, lines: [], titles: [], awards: [], loan: !!S.loan };

  // Spielerbonus für die Mannschaft
  const share = ROLE_SHARE[se.role];
  const bonus = youth ? 0 : ((p.rating - str) * 0.025 + p.form * 0.012) * (se.role === 'Stammspieler' ? 1 : se.role === 'Rotation' ? 0.5 : 0.1);

  // Alle Ligen simulieren
  const tables = {};
  for (const lg of LEAGUES) tables[lg.id] = simLeague(lg.id, own, bonus);
  const myTable = tables[L.id];
  applyDrama(myTable.rows);
  const pos = myTable.rows.findIndex(r => r.name === own) + 1;

  // Einsätze
  const focus = focusOf();
  if (focus === 'recovery') se.injuredGames = Math.round(se.injuredGames * 0.6);
  const avail = Math.max(0, myTable.games - se.injuredGames);
  const trustAdj = (p.trust - 50) / 400;
  let leagueGames = youth ? randInt(20, 28) - Math.min(10, se.injuredGames) : Math.round(avail * clamp(rand(share[0], share[1]) + trustAdj, 0.03, 1));
  leagueGames = Math.max(0, leagueGames);
  const cupRes = youth ? null : cupRun(own);
  const cupGames = cupRes ? Math.round(cupRes.played * (se.role === 'Ergänzungsspieler' ? 0.5 : 0.9)) : 0;
  let euroRes = null, euroGames = 0;
  if (!youth && S.europe) {
    euroRes = europeRun(own, S.europe);
    const matches = 8 + (euroRes.played - 1) * 2 - (euroRes.reached === 'Finale' ? 1 : 0);
    euroGames = Math.round(matches * (se.role === 'Stammspieler' ? 0.85 : se.role === 'Rotation' ? 0.55 : 0.2));
  }
  const games = leagueGames + cupGames + euroGames;
  const playStr = str + (se.role === 'Stammspieler' ? (p.rating - str) * 0.1 : 0);
  if (cupRes) queueLiveFinal(cupRes, 'cup', `${L.cup}-Sieger`, L.cup, playStr);
  if (euroRes) queueLiveFinal(euroRes, 'euro', `${euroName()}-Sieger`, euroName(), playStr);

  // Tore, Vorlagen, Note
  const P = POSITIONS[p.pos];
  const refStr = youth ? 58 : str;
  const q = clamp(0.5 + (p.rating - 72) * 0.035 + (p.rating - refStr) * 0.02 + p.form * 0.02, 0.15, 1.8) * ROLE_MIN[se.role];
  const shootF = focus === 'shooting' ? 1.2 : 1;
  const goals = Math.max(0, Math.round(games * P.goals * q * shootF * rand(0.8, 1.2)) + se.extraGoals);
  const leagueGoals = games ? Math.round(goals * leagueGames / games) : 0;
  const assists = Math.max(0, Math.round(games * P.assists * q * (focus === 'shooting' ? 1.1 : 1) * rand(0.8, 1.2)) + se.extraAssists);
  const cleanSheets = P.group === 'gk' ? Math.round(games * clamp(0.2 + (refStr - 70) * 0.015 + (p.rating - 70) * 0.006 + (focus === 'shooting' ? 0.04 : 0), 0.08, 0.6)) : 0;
  let note = 3.6 - (p.rating - refStr) * 0.04 - (p.rating - 70) * 0.03 - p.form * 0.05;
  note -= games ? ((goals + assists) / games) * 0.6 + (cleanSheets / games) * 0.8 : 0;
  note = clamp(note + gauss() * 0.12, 1.3, 5.0);
  if (games === 0) note = null;

  Object.assign(res, { games, goals, assists, cleanSheets, note, pos, teams: myTable.rows.length });

  // Liga
  if (youth) {
    if (chance(clamp((str - 62) / 45, 0.05, 0.5))) { res.titles.push('U19-Meister'); res.lines.push('🏆 Deine U19 wird Meister!'); }
    else res.lines.push(`Deine U19 beendet die Saison auf Platz ${randInt(2, 8)}.`);
  } else {
    res.lines.push(`${L.name}: ${own} wird ${pos}. von ${myTable.rows.length}.`);
    if (pos === 1) { res.titles.push(L.champion); res.lines.push(`🏆 ${L.champion}!`); }
    if (L.id === PROMOTION.upper && pos > myTable.rows.length - PROMOTION.count) res.lines.push('⬇️ Abstieg in die 2. Bundesliga!');
    if (L.id === PROMOTION.lower && pos <= PROMOTION.count) res.lines.push('⬆️ Aufstieg in die Bundesliga!');
    else if (pos <= L.cl) res.lines.push(`Qualifiziert für: ${CLUB_COMPS[confOf(L)].cl}.`);
    else if (CLUB_COMPS[confOf(L)].el && pos <= L.cl + L.el) res.lines.push(`Qualifiziert für: ${CLUB_COMPS[confOf(L)].el}.`);
  }
  if (cupRes) {
    if (cupRes.won) { res.titles.push(`${L.cup}-Sieger`); res.lines.push(`🏆 ${L.cup}-Sieger! Finale gegen ${cupRes.beat} gewonnen.`); }
    else if (cupRes.pending) res.lines.push(`🏟️ ${L.cup}: Ihr steht im Finale gegen ${cupRes.lostTo}! Das Finale spielst du live.`);
    else res.lines.push(`${L.cup}: Aus in der Runde „${cupRes.reached}“ gegen ${cupRes.lostTo}.`);
  }
  if (euroRes) {
    const name = euroName();
    if (euroRes.won) { res.titles.push(`${name}-Sieger`); res.lines.push(`🏆 ${name}-Sieger! Finale gegen ${euroRes.beat} gewonnen.`); }
    else if (euroRes.pending) res.lines.push(`🏟️ ${name}: Ihr steht im Finale gegen ${euroRes.lostTo}! Das Finale spielst du live.`);
    else res.lines.push(`${name}: Aus in der Runde „${euroRes.reached}“${euroRes.lostTo ? ` gegen ${euroRes.lostTo}` : ''}.`);
  }
  res.cupRes = cupRes; res.euroRes = euroRes;

  // Auszeichnungen
  rivalSeason(res);
  awards(res, L, leagueGoals);

  // Dopingkontrolle
  if (se.doped) {
    const caughtP = 0.3 + 0.1 * ((S.dopeCount || 1) - 1) + (p.rating >= 85 ? 0.1 : 0) + (S.diff === 'legend' ? 0.1 : 0);
    if (chance(caughtP)) {
      const prison = chance(0.35);
      const years = prison ? randInt(1, 3) : (S.dopeCaught ? 4 : 2);
      S.dopeCaught = (S.dopeCaught || 0) + 1;
      if (res.titles.length || res.awards.length) res.lines.push('❌ Alle Titel und Auszeichnungen dieser Saison werden dir aberkannt.');
      res.titles = []; res.awards = [];
      const fine = Math.max(0, 0.1 + S.money * 0.2);
      S.money -= fine;
      p.rating = clamp(p.rating - (se.dopeBoost || 4), 35, 99);
      p.popularity = clamp(p.popularity - 35, 0, 100);
      p.trust = 10;
      res.lines.push(prison
        ? `🚨 Positiver Dopingtest! Die Ermittler finden bei dir verbotene Mittel. Das Gericht verurteilt dich zu ${years} ${years === 1 ? 'Jahr' : 'Jahren'} Gefängnis und ${money(fine)} Strafe.`
        : `🚨 Positiver Dopingtest! Du wirst für ${years} Jahre gesperrt und musst ${money(fine)} Strafe zahlen.`);
      S.ban = { type: prison ? 'prison' : 'ban', years };
    } else {
      res.lines.push('💉 Die Dopingkontrollen schlagen nicht an. Du bist noch mal davongekommen.');
    }
  }

  // Beziehung kühlt ohne Pflege ab
  const l = life();
  if (l.partner) {
    l.partner.rel = clamp(l.partner.rel - randInt(4, 12) - (S.ban ? 25 : 0), 0, 100);
    if (l.partner.rel < 15) res.lines.push(`💔 ${l.partner.name} hat genug und trennt sich von dir. ${breakUp()}`);
  }

  S.titles.push(...res.titles.map(t => `${t} (${seasonLabel(S.year)})`));
  S.awards.push(...res.awards.map(a => `${a} (${seasonLabel(S.year)})`));

  // Vertrauen, Beliebtheit, Form
  if (note !== null) {
    if (note <= 2.5) p.trust = clamp(p.trust + 8, 0, 100);
    else if (note >= 3.8) p.trust = clamp(p.trust - 8, 0, 100);
    p.popularity = clamp(p.popularity + (3.2 - note) * 4 + res.titles.length * 3, 0, 100);
  }
  p.trust = Math.round(p.trust + (50 - p.trust) * 0.15 + (focus === 'tactics' ? 6 : 0));
  p.popularity = Math.round(p.popularity);

  // Entwicklung
  const before = p.rating;
  const a = p.age;
  let g = a <= 19 ? 5 : a <= 22 ? 3.5 : a <= 25 ? 1.5 : a <= 28 ? 0.5 : a <= 30 ? -0.7 : a <= 32 ? -1.8 : a <= 34 ? -3 : -4.5;
  if (g > 0) {
    g *= diff().growth;
    const play = { 'Stammspieler': 1.25, 'Rotation': 1, 'Ergänzungsspieler': 0.55, 'U19': 1 }[se.role];
    g *= play;
    if (p.rating >= p.potential) g *= 0.15;
    else if (p.rating + g > p.potential) g = p.potential - p.rating + 0.3;
  }
  g += se.devBonus + rand(-1.2, 1.2) + (note !== null && note < 2.3 ? 0.8 : 0) + (focus === 'technique' ? 0.7 : 0);
  if (se.injuredGames > 12) g -= 1;
  p.rating = clamp(p.rating + g, 35, 99);
  S.peak = Math.max(S.peak, Math.round(p.rating));
  res.ratingBefore = Math.round(before);
  res.ratingAfter = Math.round(p.rating);
  p.form = Math.round(p.form * 0.4);
  p.injuryProne = clamp(p.injuryProne + (a >= 30 ? 1.5 : -0.5) - (focus === 'athletic' ? 4 : 0), 0, 40);

  res.table = myTable.rows.map(r => ({ name: r.name, pts: r.pts }));
  res.scenes = se.scenes.slice();

  S.history.push({
    year: S.year, age: p.age, club: own, role: se.role, games, goals, assists, cleanSheets,
    note, rating: res.ratingAfter, titles: res.titles.length, youth, loan: !!S.loan,
  });

  // Tabellen merken, Auf-/Abstieg, Stärke-Schwankungen
  for (const lg of LEAGUES) S.lastTables[lg.id] = tables[lg.id].rows.map(r => r.name);
  const up = S.lastTables[PROMOTION.lower].slice(0, PROMOTION.count);
  const down = S.lastTables[PROMOTION.upper].slice(-PROMOTION.count);
  up.forEach(n => { S.clubs[n].league = PROMOTION.upper; });
  down.forEach(n => { S.clubs[n].league = PROMOTION.lower; });
  for (const n of Object.keys(S.clubs)) S.clubs[n].drift = S.clubs[n].drift * 0.6 + rand(-2.5, 2.5);

  // Nationalmannschaft / Turnier im Sommer
  res.tournament = tournament(res);

  // Finanzen: Gehalt, Prämien und Sponsoren (nach 45 % Steuern), minus Unterhalt
  const c = S.contract;
  const gross = c.salary;
  const bonusPay = (res.titles.length * 0.15 + res.awards.length * 0.1 + (res.tournament && res.tournament.won ? 0.2 : 0)) * gross;
  const sponsor = youth ? 0 : sponsorIncome();
  const upkeep = SHOP.reduce((sum, it) => sum + ownedCount(it.id) * it.price * it.upkeep, 0);
  const fund = ownedCount('fund') * rand(-0.08, 0.14);
  const agentFee = S.agent ? gross * 0.1 : 0;
  const net = (gross + bonusPay + sponsor - agentFee) * 0.55;
  S.money += net - upkeep + fund;
  S.earned += net;
  c.years -= 1;
  res.finance = { gross, bonusPay, sponsor, agentFee, net, upkeep, fund, total: net - upkeep + fund };

  // Familie, Mannschaft, Firmen, Meilensteine
  familySeason(res);
  teamSeason(res);
  if (businesses().length) res.finance.business = businessSeason(res);
  evalSeasonGoals(res);
  nationalSeason(res);
  socialSeason(res);
  const living = homeSeason(res) + petsSeason(res);
  S.money -= living;
  if (living) res.finance.living = living;
  if (S.taxRisk && chance(0.4)) {
    S.taxRisk = false;
    S.court = { charge: 'Steuerhinterziehung', severity: 2 };
    res.lines.push('🚨 Die Steuerfahndung durchsucht dein Haus! Es kommt zum Prozess.');
  }
  celebrationSeason(res);
  checkMilestones(res);
  S.headline = seasonHeadline(res);
  updateRecords(res);
  if (res.titles.length || res.awards.includes("Ballon d'Or")) queueFx('fanfare', 'confetti');

  p.age++;
  S.seasonEnd = res;
  S.phase = S.finals && S.finals.length ? 'final' : S.shootouts && S.shootouts.length ? 'shootout' : 'seasonEnd';
  S.current = null;
}

function cupRun(club) {
  const L = clubLeague(club);
  const pool = Object.keys(S.clubs).filter(n => n !== club && clubLeague(n).country === L.country).map(n => ({ name: n, str: clubStr(n) }));
  return knockout(clubStr(club) + (S.season.role === 'Stammspieler' ? (S.player.rating - clubStr(club)) * 0.1 : 0),
    ['1. Runde', '2. Runde', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'], pool, 4.5, true);
}

// Mögliche Gegner im internationalen Wettbewerb des eigenen Kontinentalverbands
function euroPool(club, comp) {
  const L = clubLeague(club), conf = confOf(L), C = CLUB_COMPS[conf];
  const min = comp === 'cl' ? C.clMin : C.elMin, maxS = comp === 'cl' ? 99 : C.elMax;
  // In Europa trifft man keine Klubs aus der eigenen Liga; anderswo gibt es zu wenige spielbare Ligen dafür
  const pool = Object.keys(S.clubs).filter(n => n !== club && confOf(clubLeague(n)) === conf
    && (conf !== 'UEFA' || S.clubs[n].league !== L.id) && clubStr(n) >= min && clubStr(n) <= maxS)
    .map(n => ({ name: n, str: clubStr(n) }));
  for (const [n, str] of EXTRA_OPPONENTS[conf] || []) if (comp === 'cl' || str <= maxS) pool.push({ name: n, str });
  return pool;
}

function europeRun(club, comp) {
  const pool = euroPool(club, comp);
  const avg = pool.reduce((s, x) => s + x.str, 0) / Math.max(1, pool.length);
  const bonus = S.season.role === 'Stammspieler' ? (S.player.rating - clubStr(club)) * 0.1 : 0;
  const ownStr = clubStr(club) + bonus;
  // Ligaphase: Weiterkommen hängt von der Stärke ab
  const passLeague = sigmoid((ownStr - (avg - 3)) / 3.5);
  if (!chance(passLeague)) return { won: false, reached: comp === 'cl' && confOf(clubLeague(club)) === 'UEFA' ? 'Ligaphase' : 'Gruppenphase', played: 1 };
  const direct = chance(sigmoid((ownStr - (avg + 3)) / 3));
  const rounds = direct ? ['Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'] : ['K.-o.-Playoffs', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'];
  const r = knockout(ownStr, rounds, pool, 4.5);
  r.played += 1;
  return r;
}

function awards(res, L, leagueGoals) {
  const p = S.player;
  if (S.youth || res.games < 10) return;
  const grp = POSITIONS[p.pos].group;
  const stamm = res.role === 'Stammspieler';
  // Torschützenkönig
  if (leagueGoals >= L.scorerBase + randInt(-4, 5)) { res.awards.push(L.topScorer); res.lines.push(`👟 ${L.topScorer} mit ${leagueGoals} Ligatoren!`); }
  // Goldener Schuh
  if ((L.top5 && leagueGoals >= 31 + randInt(0, 5)) || (!L.top5 && leagueGoals >= 40)) { res.awards.push('Goldener Schuh'); res.lines.push('👟 Goldener Schuh als bester Torjäger Europas!'); }
  // Golden Boy
  if (p.age <= 20 && p.rating >= 77 && stamm && chance(0.6)) { res.awards.push('Golden Boy'); res.lines.push('⭐ Golden Boy – bester junger Spieler Europas!'); }
  // Jaschin-Trophäe
  if (grp === 'gk' && p.rating >= 86 && stamm && chance(0.5)) { res.awards.push('Jaschin-Trophäe'); res.lines.push('🧤 Jaschin-Trophäe als bester Torwart der Welt!'); }
  // Spieler der Saison
  if (res.note !== null && res.note <= 2.2 && stamm && chance(0.5)) { res.awards.push(`Spieler der Saison (${L.name})`); res.lines.push(`⭐ Spieler der Saison in der ${L.name}!`); }
  // Ballon d'Or
  let perf = grp === 'att' ? Math.min(6, (res.goals + res.assists * 0.5) / 8)
    : grp === 'mid' ? Math.min(6, (res.goals + res.assists) / 6)
      : clamp((3 - (res.note || 4)) * 3, 0, 5);
  let score = p.rating + p.form * 0.3 + perf + (grp === 'def' ? -2 : grp === 'gk' ? -3 : 0);
  const uefa = confOf(L) === 'UEFA';
  if (res.euroRes && res.euroRes.won && S.europe === 'cl') score += uefa ? 4 : 1.5;
  else if (res.euroRes && S.europe === 'cl' && uefa && ['Halbfinale', 'Finale'].includes(res.euroRes.reached)) score += 1.5;
  if (res.titles.includes(L.champion)) score += 1.5;
  if (!stamm) score -= 6;
  res.bdScore = score;
  const rivalScore = rivalBallonScore();
  const wins = score >= 101 && chance(0.85) || score >= 99 && chance(0.45);
  if (wins && rivalScore > score) {
    S.rival.ballon++;
    res.lines.push(`😤 Der Ballon d'Or geht an deinen Rivalen ${S.rival.name}. Du wirst Zweiter!`);
  } else if (wins) { res.awards.push("Ballon d'Or"); res.lines.push("🏅 BALLON D'OR! Du bist der beste Fußballer der Welt!"); }
  else {
    if (rivalScore >= 97.5 && chance(0.5)) { S.rival.ballon++; res.lines.push(`😤 Dein Rivale ${S.rival.name} gewinnt den Ballon d'Or.`); }
    if (score >= 95.5) res.lines.push(`Ballon d'Or: Platz ${clamp(Math.round(2 + (101 - score) * 1.5 + rand(0, 2)), 2, 20)}.`);
  }
}

function tournament(res) {
  const summer = S.year + 1;
  if (summer % 2 !== 0) return null;
  const nat = nation();
  const wm = summer % 4 === 2;
  const name = wm ? 'Weltmeisterschaft' : CONTINENTAL[nat.conf].name;
  const title = wm ? 'Weltmeister' : CONTINENTAL[nat.conf].title;
  const p = S.player;
  const out = { name, summer, lines: [] };
  if (S.natRetired) { out.lines.push(`Du bist aus der Nationalmannschaft zurückgetreten und schaust die ${name} vor dem Fernseher.`); out.nominated = false; return out; }
  if (p.age < 18 || S.youth || S.fugitive || p.rating < nat.str - 8 || (res.games < 8 && p.rating < nat.str)) {
    out.lines.push(`Du wirst für die ${name} ${summer} nicht nominiert.`);
    out.nominated = false;
    return out;
  }
  out.nominated = true;
  let starter = p.rating >= nat.str - 2;
  if (starter && rivalActive() && S.rival.nation === nat.name && S.rival.pos === p.pos && S.rival.rating > p.rating + 1) {
    starter = false;
    out.lines.push(`🆚 Dein Rivale ${S.rival.name} bekommt den Stammplatz auf deiner Position.`);
  }
  out.lines.push(`Du stehst im Kader von ${nat.name} für die ${name} ${summer}${starter ? ' – als Stammspieler!' : '.'}`);
  if (wm && !chance(clamp(sigmoid((nat.str - 72) / 3), 0.1, 0.99))) {
    out.lines.push(`${nat.name} verpasst leider die Qualifikation.`);
    return out;
  }
  const pool = NATIONS.filter(n => n.name !== nat.name && (wm || n.conf === nat.conf)).map(n => ({ name: n.name, str: n.str }));
  const rounds = wm ? ['Gruppenphase', 'Sechzehntelfinale', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'] : ['Gruppenphase', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'];
  const r = knockout(nat.str + (starter ? (p.rating - nat.str) * 0.15 : 0), rounds, pool, 5, true);
  const games = starter ? 2 + r.played : randInt(1, 1 + r.played);
  const rate = POSITIONS[p.pos].goals * clamp((p.rating - 60) / 25, 0.2, 1.4);
  const goals = Math.round(games * rate * rand(0.6, 1.3));
  p.caps += games; p.intGoals += goals;
  out.lines.push(`Du machst ${games} Spiele${goals ? ` und schießt ${goals} Tor${goals > 1 ? 'e' : ''}` : ''}.`);
  if (queueLiveFinal(r, 'nation', `${title} ${summer}`, name, nat.str + (starter ? (p.rating - nat.str) * 0.15 : 0))) {
    out.lines.push(`🏟️ ${nat.name} steht im Finale gegen ${r.lostTo}! Das Finale spielst du live.`);
  } else if (r.won) {
    out.lines.push(`🏆 ${nat.name} ist ${title}! Finale gegen ${r.beat} gewonnen!`);
    S.titles.push(`${title} ${summer}`);
    p.popularity = clamp(p.popularity + 12, 0, 100);
    out.won = true;
  } else {
    out.lines.push(`Aus in der Runde „${r.reached}“ gegen ${r.lostTo}.`);
  }
  return out;
}

// ---------- Transfers ----------
function openTransfer() {
  const p = S.player, res = S.seasonEnd;
  const msgs = [];
  if (S.ban) { S.phase = 'banned'; return; }
  if (p.age >= 41) { retire('Mit 41 Jahren ist Schluss – dein Körper macht nicht mehr mit.'); return; }
  if (S.loan) {
    msgs.push(`Deine Leihe ist beendet. Du kehrst zu ${S.loan.parent} zurück.`);
    S.clubId = S.loan.parent;
    S.loan = null;
  }
  if (S.youth) {
    S.youth = false;
    S.contract = { salary: salaryFor(p.rating, S.clubId, 'Ergänzungsspieler'), years: 3 };
    msgs.push(`Du wirst in den Profikader von ${S.clubId} befördert und bekommst deinen ersten Profivertrag: ${money(S.contract.salary)} pro Jahr, 3 Jahre.`);
  }
  const str = clubStr(S.clubId);
  const released = S.forceRelease || (!res.loan && p.rating < str - 14 && p.age >= 19);
  if (S.forceRelease) msgs.push('Nach deiner Sperre will dich dein alter Verein nicht mehr. Du musst dir einen neuen Klub suchen.');
  S.forceRelease = false;
  if (released && !msgs.length) msgs.push(`${S.clubId} verlängert deinen Vertrag nicht. Du musst dir einen neuen Verein suchen.`);

  const perf = res.note === null ? 0 : (3.2 - res.note);
  const hi = p.rating + 3 + (perf > 0.6 ? 3 : 0) + (p.popularity > 70 ? 2 : 0);
  const lo = p.rating - (released ? 22 : 12);
  const cands = Object.keys(S.clubs).filter(n => n !== S.clubId && clubStr(n) >= lo && clubStr(n) <= hi
    && (!S.fugitive || clubLeague(n).country !== nation().country))
    .sort((a, b) => clubStr(b) - clubStr(a));
  let k = randInt(1, 3) + (perf > 0.5 ? 1 : 0) + (S.season.transferBoost || 0) + (S.agent ? 1 : 0) - (p.age >= 33 ? 1 : 0);
  if (released) k = Math.max(k, 2);
  const chosen = [];
  const top = cands.slice(0, Math.max(6, Math.ceil(cands.length / 3)));
  for (const n of shuffle(top)) { if (chosen.length >= k) break; chosen.push(n); }
  const expired = S.contract.years <= 0;
  const newOffer = n => {
    const sal = salaryFor(p.rating, n, roleFor(p.rating, clubStr(n), 45)) * rand(1, 1.3) * (S.agent ? 1.15 : 1);
    return {
      club: n, loan: false, salary: sal, years: p.age >= 31 ? randInt(1, 2) : randInt(2, 5),
      // Ablösefrei bei auslaufendem Vertrag – dafür gibt es ein höheres Handgeld
      fee: expired || released ? 0 : marketValue() * rand(0.9, 1.5),
      signing: sal * (expired || released ? 0.8 : 0.25),
    };
  };
  const offers = chosen.map(newOffer);

  // Lukratives Angebot aus Saudi-Arabien für etablierte Spieler
  if (S.clubs[S.clubId].league !== 'sa' && p.age >= 27 && p.rating >= 76 && chance(0.35)) {
    const sa = shuffle(clubsIn('sa').sort((a, b) => clubStr(b) - clubStr(a)).slice(0, 5)).find(n => !chosen.includes(n));
    if (sa) { const o = newOffer(sa); o.salary *= 1.4; o.signing *= 2; offers.push(o); }
  }

  // Leihangebote für junge Ergänzungsspieler
  const wasBench = res.role === 'Ergänzungsspieler' || (res.role === 'Rotation' && res.games < 18) || res.role === 'U19';
  if (!released && p.age <= 22 && wasBench) {
    const loanCands = shuffle(Object.keys(S.clubs).filter(n => n !== S.clubId && clubStr(n) >= p.rating - 7 && clubStr(n) <= p.rating + 1));
    loanCands.slice(0, randInt(1, 2)).forEach(n => offers.push({ club: n, loan: true, fee: 0, salary: 0, years: 1, signing: 0 }));
  }
  // Junge Spieler finden immer einen kleineren Verein
  if (released && !offers.length && p.age < 30) {
    const weakest = Object.keys(S.clubs).filter(n => n !== S.clubId).sort((a, b) => clubStr(a) - clubStr(b)).slice(0, 12);
    shuffle(weakest).slice(0, 2).forEach(n => offers.push(newOffer(n)));
  }
  dreamOffer(offers, newOffer, p);
  offers.sort((a, b) => clubStr(b.club) - clubStr(a.club));
  if (released && !offers.length) {
    retire('Kein Verein will dich mehr verpflichten. Du beendest deine Karriere.');
    return;
  }
  const stayRole = roleFor(p.rating, str, p.trust);
  const extension = !released && expired
    ? { salary: salaryFor(p.rating, S.clubId, stayRole) * rand(0.95, 1.15), years: p.age >= 31 ? randInt(1, 2) : randInt(2, 4) }
    : null;
  // Ein weiterer Interessent, den nur ein Topberater an Land zieht
  const spareClub = top.find(n => !chosen.includes(n) && !offers.some(o => o.club === n));
  const spare = spareClub ? newOffer(spareClub) : null;
  S.offers = { list: offers, released, msgs, extension, raiseTried: false, spare };
  S.lifeMsg = null; S.peopleMsg = null; S.bizMsg = null;
  S.phase = 'transfer';
}

function acceptOffer(o) {
  if (o) {
    if (o.loan) S.loan = { parent: S.clubId };
    else {
      S.contract = { salary: o.salary, years: o.years };
      S.money += o.signing * 0.55;
      S.earned += o.signing * 0.55;
    }
    if (o.fee >= 30) setHeadline(`MEGA-TRANSFER! ${lastName()} WECHSELT FÜR ${money(o.fee).toUpperCase()} ZU ${o.club.toUpperCase()}`);
    else if (o.club === S.dreamClub) setHeadline(`TRAUM ERFÜLLT! ${lastName()} UNTERSCHREIBT BEI ${o.club.toUpperCase()}`);
    else if (!o.loan) setHeadline(`${lastName()} WECHSELT ZU ${o.club.toUpperCase()}`);
    S.clubId = o.club;
    S.player.trust = 45;
    if (o.club === S.dreamClub) { S.player.popularity = clamp(S.player.popularity + 5, 0, 100); S.player.form = clamp(S.player.form + 3, -10, 10); toast(`⭐ Traum erfüllt: Du spielst für ${o.club}!`); queueFx('fanfare', 'confetti'); }
  } else if (S.offers.extension) {
    S.contract = { ...S.offers.extension };
  }
  S.offers = null;
  S.year++;
  startSeason();
}

function hireAgent() {
  const o = S.offers;
  S.agent = true;
  o.list.forEach(of => { if (!of.loan) { of.salary *= 1.15; of.signing *= 1.15; } });
  if (o.extension) o.extension.salary *= 1.15;
  if (o.spare) { o.spare.salary *= 1.15; o.spare.signing *= 1.15; o.list.push(o.spare); o.spare = null; }
  o.list.sort((a, b) => clubStr(b.club) - clubStr(a.club));
  o.msgs.push('Dein neuer Topberater verhandelt ab sofort für dich: bessere Gehälter und mehr Angebote, dafür 10 % Provision.');
}

function demandRaise() {
  const p = S.player, o = S.offers;
  o.raiseTried = true;
  const target = salaryFor(p.rating, S.clubId, roleFor(p.rating, clubStr(S.clubId), p.trust));
  if (chance(clamp((p.trust - 30) / 60 + (p.popularity - 50) / 200, 0.1, 0.9))) {
    S.contract = { salary: target, years: Math.max(S.contract.years, 3) };
    o.msgs.push(`Der Verein gibt nach: Dein neues Gehalt beträgt ${money(target)} pro Jahr, Vertrag bis ${S.year + 1 + S.contract.years}.`);
  } else {
    p.trust = clamp(p.trust - 10, 0, 100);
    o.msgs.push('Der Verein lehnt ab und findet deine Forderung unverschämt. Das Vertrauen sinkt.');
  }
}

function buy(item) {
  S.money -= item.price;
  S.owned[item.id] = ownedCount(item.id) + 1;
  S.player.popularity = clamp(S.player.popularity + item.pop, 0, 100);
}
function sellFund() {
  S.owned.fund = ownedCount('fund') - 1;
  S.money += 1;
}

function banAppeal() {
  const b = S.ban;
  const cost = 0.1 + Math.max(0, S.money) * 0.05;
  S.money -= cost;
  b.appealed = true;
  if (chance(0.35)) {
    b.years--;
    b.msg = b.years <= 0
      ? `Die Berufung hat Erfolg! Das Urteil wird aufgehoben. Die Anwälte kosten ${money(cost)}.`
      : `Die Berufung hat teilweise Erfolg: ein Jahr weniger. Die Anwälte kosten ${money(cost)}.`;
  } else b.msg = `Die Berufung wird abgelehnt. Die Anwälte kosten trotzdem ${money(cost)}.`;
}

function banEscape() {
  const b = S.ban;
  b.escaped = true;
  if (chance(0.12)) {
    S.fugitive = true;
    S.player.popularity = clamp(S.player.popularity - 15, 0, 100);
    b.years = 0;
    b.msg = `Du kletterst nachts über die Mauer und fliehst ins Ausland! In ${S.player.nation} wirst du ab jetzt gesucht – dort und in der Nationalmannschaft kannst du nie wieder spielen.`;
  } else {
    b.years += 2;
    S.player.popularity = clamp(S.player.popularity - 5, 0, 100);
    b.msg = 'Die Wärter erwischen dich am Zaun. Zwei Jahre zusätzlich!';
  }
}

function serveBan(choice) {
  const p = S.player, b = S.ban;
  const upkeep = SHOP.reduce((sum, it) => sum + ownedCount(it.id) * it.price * it.upkeep, 0);
  for (let i = 0; i < b.years; i++) {
    S.history.push({
      year: S.year + 1 + i, age: p.age, club: b.type === 'prison' ? 'Gefängnis' : 'Dopingsperre', role: '—',
      games: 0, goals: 0, assists: 0, cleanSheets: 0, note: null, rating: Math.round(p.rating), titles: 0, youth: false, loan: false, banned: true,
    });
    p.age++;
    p.rating = clamp(p.rating - choice.loss - (p.age >= 30 ? 1.5 : 0), 35, 99);
    S.money -= upkeep + (choice.cost || 0);
  }
  S.year += b.years;
  if (choice.book) { S.money += 0.2 + p.popularity / 100; p.popularity = clamp(p.popularity + 10, 0, 100); }
  if (choice.money) S.money += choice.money * b.years;
  if (choice.pop) p.popularity = clamp(p.popularity + choice.pop, 0, 100);
  S.banResult = b.years ? `${choice.text} Nach ${b.years} ${b.years === 1 ? 'Jahr' : 'Jahren'} bist du wieder frei.` : 'Du bist frei!';
  S.ban = null;
  S.loan = null;
  S.forceRelease = true;
  S.contract = { salary: S.contract.salary, years: 0 };
  p.trust = 40 + (choice.trust || 0);
  p.form = 0;
  openTransfer();
  if (S.offers) S.offers.msgs.unshift(S.banResult);
}

function retire(reason) {
  S.phase = 'retired';
  S.retireReason = reason;
  S.retireAge = S.player.age;
  S.offers = null;
  updateRecords(null);
  saveHallOfFame();
}

// ---------- Rendering ----------
function render(keepScroll = false) {
  handlers = [];
  const root = app();
  let html = '';
  if (uiHelp) html = renderHelp();
  else if (!S) html = renderStart();
  else if (S.phase === 'create') html = renderCreate();
  else if (S.phase === 'academy') html = renderAcademy();
  else if (['coachOffers', 'coach', 'coachEnd'].includes(S.phase)) html = renderCoach();
  else if (S.phase === 'owner') html = renderOwner();
  else {
    html = renderPlayerCard();
    if (S.phase === 'preseason' || S.phase === 'transfer') html += renderHub();
    else if (S.phase === 'season') html += tip(S.current.type) + (S.current.type === 'event' ? renderEvent() : S.current.type === 'rehab' ? renderRehab() : renderMatch());
    else if (S.phase === 'seasonEnd') html += tip('seasonEnd') + renderSeasonEnd();
    else if (S.phase === 'banned') html += renderBanned();
    else if (S.phase === 'shootout') html += renderShootout();
    else if (S.phase === 'final') html += renderFinal();
    else if (S.phase === 'retired') html = renderRetired();
  }
  root.innerHTML = html;
  if (S && S.phase !== 'create' && !uiHelp) save();
  if (!keepScroll) window.scrollTo({ top: 0 });
  if (S && S.player && S.phase !== 'create') { checkAchievements(); checkDaily(); }
  if (S && S.phase === 'seasonEnd' && S.seasonEnd && !S.seasonEnd.animated) {
    S.seasonEnd.animated = true;
    animateRecap();
    if (!prefs().noRecap) openRecap();
  }
  flushFx();
}
