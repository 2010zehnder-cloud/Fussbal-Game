function renderTransfer() {
  const o = S.offers, p = S.player;
  const rank = { 'Stammspieler': 3, 'Rotation': 2, 'Ergänzungsspieler': 1 };
  const curStr = clubStr(S.clubId);
  const curRole = roleFor(p.rating, curStr, p.trust);
  const list = o.list.map(of => {
    const str = clubStr(of.club);
    const role = roleFor(p.rating, str, 45);
    const tags = [];
    if (of.dream) tags.push(['good', '⭐ Traumverein!']);
    if (of.loan) tags.push(['good', '🔁 Leihe: Spielpraxis sammeln']);
    if (!o.released && rank[role] > rank[curRole]) tags.push(['good', '⏱️ Mehr Spielzeit']);
    if (!o.released && rank[role] < rank[curRole]) tags.push(['bad', '⚠️ Weniger Spielzeit']);
    if (str >= curStr + 3) tags.push(['good', '📈 Stärkerer Verein']);
    if (str <= curStr - 3) tags.push(['bad', '📉 Schwächerer Verein']);
    if (!of.loan && of.salary > S.contract.salary * 1.1) tags.push(['good', '💶 Mehr Gehalt']);
    return `
    <div class="offer">
      ${crest(of.club)}
      <div class="offer-info"><strong>${esc(of.club)}</strong>
        <small>${esc(clubLeague(of.club).name)} · Stärke ${str} · Rolle: ${role}</small>
        ${tags.length ? `<div class="tags">${tags.map(([c, t]) => `<span class="tag ${c}">${t}</span>`).join('')}</div>` : ''}
        ${of.loan ? '<small>Leihe für 1 Saison · dein Gehalt bleibt gleich</small>'
          : `<small><b>${money(of.salary)}/Jahr</b> · ${of.years} ${of.years === 1 ? 'Jahr' : 'Jahre'} · Handgeld ${money(of.signing)}</small>
             <small>${of.fee ? `Ablöse: ${money(of.fee)}` : 'Ablösefrei'}</small>`}
      </div>
      ${btn(of.loan ? 'Leihe annehmen' : 'Wechseln', () => acceptOffer(of) || render(), 'primary small')}
    </div>`;
  }).join('');
  const stayRole = roleFor(p.rating, clubStr(S.clubId), p.trust);
  const c = S.contract, ext = o.extension;
  let stay = '';
  if (!o.released) {
    stay = ext
      ? btn(`Vertrag bei ${esc(S.clubId)} verlängern<small>${money(ext.salary)}/Jahr · ${ext.years} ${ext.years === 1 ? 'Jahr' : 'Jahre'} · Rolle: ${stayRole}</small>`, () => acceptOffer(null) || render(), 'primary')
      : btn(`Bei ${esc(S.clubId)} bleiben<small>Rolle: ${stayRole} · Vertrag noch ${c.years} ${c.years === 1 ? 'Jahr' : 'Jahre'}</small>`, () => acceptOffer(null) || render(), 'primary');
  }
  const fair = salaryFor(p.rating, S.clubId, stayRole);
  const raise = !o.released && !ext && !o.raiseTried && fair > c.salary * 1.35
    ? btn(`Gehaltserhöhung fordern<small>ca. ${money(fair)}/Jahr</small>`, () => { demandRaise(); render(); })
    : '';
  const agentBtn = S.agent
    ? btn('Berater entlassen<small>keine Provision mehr</small>', () => { S.agent = false; o.msgs.push('Du trennst dich von deinem Berater.'); render(); }, 'small')
    : btn('Topberater engagieren<small>+15 % Gehalt, mehr Angebote · 10 % Provision</small>', () => { hireAgent(); render(); });
  return `
  <section class="card">
    <h2>Transferfenster – Sommer ${S.year + 1}</h2>
    ${o.msgs.map(m => `<p class="note">${esc(m)}</p>`).join('')}
    ${stay ? `<h3>1. Bei deinem Verein bleiben</h3><div class="choices">${stay}</div>` : ''}
    <h3>${stay ? '2. ' : ''}Oder wechseln</h3>
    ${o.list.length ? `<div class="offers">${list}</div>` : '<p class="muted">Diesmal gibt es keine Angebote für dich.</p>'}
    <details class="more"><summary>Weitere Optionen</summary>
      <div class="lifeacts">
        ${raise}
        ${agentBtn}
        ${p.caps > 0 && p.age >= 29 && !S.natRetired ? btn('Rücktritt aus der Nationalmannschaft<small>Mehr Ruhe, keine Länderspiele mehr</small>', () => { S.natRetired = true; S.player.injuryProne = clamp(S.player.injuryProne - 3, 0, 40); o.msgs.push(`Du erklärst nach ${p.caps} Länderspielen deinen Rücktritt aus der Nationalmannschaft. Standing Ovations beim Abschiedsspiel!`); render(); }) : ''}
        ${p.age >= 33 ? btn('Karriere beenden<small>Schuhe an den Nagel hängen</small>', () => { retire('Du hast dich entschieden, deine Karriere zu beenden.'); render(); }, 'danger') : ''}
      </div>
    </details>
  </section>`;
}

function renderBanned() {
  const b = S.ban;
  const prison = b.type === 'prison';
  if (prison && b.cellmate === undefined) b.cellmate = randInt(0, CELLMATES.length - 1);
  const mate = prison ? CELLMATES[b.cellmate] : null;
  const choices = [...BAN_CHOICES[b.type], ...(mate ? [mate.choice] : [])];
  const appealCost = 0.1 + Math.max(0, S.money) * 0.05;
  const free = b.years <= 0;
  return `
  <section class="card banned">
    <h2>${prison ? 'Hinter Gittern' : 'Gesperrt'}</h2>
    <p>${free ? 'Du bist frei!' : prison
    ? `Du musst ${b.years} ${b.years === 1 ? 'Jahr' : 'Jahre'} ins Gefängnis. Deine Karriere steht still, dein Vertrag ist aufgelöst.`
    : `Du darfst ${b.years} ${b.years === 1 ? 'Jahr' : 'Jahre'} lang kein Pflichtspiel bestreiten. Dein Vertrag ist aufgelöst.`}</p>
    ${mate && !free ? `<p>Dein Zellengenosse ist ${esc(mate.who)}.</p>` : ''}
    ${b.msg ? `<div class="result"><p>${esc(b.msg)}</p></div>` : ''}
    ${free ? `<div class="actions">${btn('In die Freiheit', () => { serveBan({ text: '', loss: 0 }); render(); }, 'primary')}</div>` : `
    <div class="lifeacts">
      ${b.appealed ? '' : btn(`${prison ? 'Berufung einlegen' : 'Einspruch beim Sportgericht'}<small>Anwälte: ${money(appealCost)} · Chance 35 %</small>`, () => { banAppeal(); render(true); }, 'small')}
      ${prison && !b.escaped ? btn('Ausbruch versuchen<small>Sehr riskant!</small>', () => { banEscape(); render(true); }, 'small risky') : ''}
    </div>
    <p>Wie nutzt du die Zeit?</p>
    <div class="choices">${choices.map(c => btn(esc(c.label), () => { serveBan(c); render(); })).join('')}</div>`}
  </section>`;
}

// Aktionen, die jeweils einmal pro Saison möglich sind
const actUsed = k => !!(S.season && S.season.acts && S.season.acts[k]);
function useAct(k) { S.season.acts = S.season.acts || {}; S.season.acts[k] = true; }
function lifeAction(k, fn) {
  return () => { useAct(k); S.lifeMsg = fn(); S.peopleMsg = null; render(true); };
}
function actBtn(k, label, sub, fn, extraCls = '') {
  const used = actUsed(k);
  return btn(`${label}<small>${used ? 'diese Saison schon gemacht' : sub}</small>`, used ? () => {} : lifeAction(k, fn), used ? `small disabled ${extraCls}` : `small ${extraCls}`);
}

function renderLife() {
  const l = life(), p = S.player;
  const pre = S.phase === 'preseason';
  let rel = '';
  if (l.partner) {
    const pa = l.partner;
    const dateCost = Math.max(0.002, S.money * 0.01), giftCost = Math.max(0.01, S.money * 0.04);
    rel = `
      <div class="partner">
        <div><strong>${esc(pa.name)}</strong><small>${esc(pa.job)} · ${l.married ? 'verheiratet' : 'Beziehung'}</small></div>
        ${bar('Beziehung', pa.rel, 100)}
      </div>
      <div class="lifeacts">
        ${actBtn('date', 'Date ausgehen', money(dateCost), () => 'Ein schöner Abend zu zweit.' + mod({ rel: randInt(8, 15), money: -dateCost, form: 1 }))}
        ${actBtn('gift', 'Teures Geschenk', money(giftCost), () => `${pa.name} freut sich riesig.` + mod({ rel: randInt(14, 20), money: -giftCost }))}
        ${l.married ? '' : actBtn('propose', 'Heiratsantrag', `Chance ca. ${Math.round(clamp(pa.rel / 110, 0.05, 0.9) * 100)} %`, () => {
          if (chance(clamp(pa.rel / 110, 0.05, 0.9))) { l.married = true; return `${pa.name} sagt JA! 💍 Ihr seid jetzt verheiratet.` + mod({ rel: 15, popularity: 4, money: -Math.max(0.02, Math.min(1, S.money * 0.05)) }); }
          return `${pa.name} ist noch nicht so weit. Die Stimmung ist gedrückt.` + mod({ rel: -15 });
        })}
        ${l.children.length < 6 ? actBtn('family', 'Familie planen', pa.rel >= 40 ? 'Kinderwunsch' : 'Beziehung zu schwach', () => {
          if (pa.rel < 40) return `${pa.name} findet, dass eure Beziehung dafür noch nicht stabil genug ist.` + mod({ rel: -5 });
          if (chance(0.65)) { const c = haveChild(); return `👶 Ihr bekommt ein Baby! Ihr nennt es ${c}.` + mod({ rel: 10, popularity: 3, form: 1 }); }
          return 'Es klappt diesmal noch nicht. Vielleicht nächste Saison.' + mod({});
        }) : ''}
        ${btn(`${l.married ? 'Scheidung einreichen' : 'Schluss machen'}<small>${l.married ? 'kostet 30 % Vermögen' : 'Beziehung beenden'}</small>`, () => { S.lifeMsg = breakUp(); render(true); }, 'small danger')}
      </div>`;
  } else {
    const cands = l.candidates || [];
    rel = `
      <p class="muted">Du bist Single.${l.exes ? ` Ex-Partner: ${l.exes}.` : ''}</p>
      ${cands.length ? `<div class="offers">${cands.map((c, i) => `
        <div class="offer"><div class="offer-info"><strong>${esc(c.name)}, ${c.age}</strong><small>${esc(c.job)} · Chemie ${'♥'.repeat(c.chem)}${'♡'.repeat(5 - c.chem)}</small></div>
        ${btn('Ansprechen', () => {
          l.candidates.splice(i, 1);
          const pChance = clamp(0.2 + c.chem * 0.1 + p.popularity / 250 + (S.money > 1 ? 0.08 : 0), 0.1, 0.9);
          if (chance(pChance)) { l.partner = { name: c.name, rel: 45 + c.chem * 6, job: c.job }; l.candidates = []; S.lifeMsg = `${c.name} sagt Ja! Ihr seid jetzt ein Paar. ❤️` + mod({ form: 2 }); }
          else S.lifeMsg = `${c.name} hat kein Interesse. Autsch.` + mod({ form: -1 });
          render(true);
        }, 'small')}</div>`).join('')}</div>` : ''}
      <div class="lifeacts">
        ${actBtn('search', 'Auf Partnersuche gehen', 'Leute kennenlernen', () => {
          l.candidates = Array.from({ length: 3 }, () => ({ name: pick(PARTNER_NAMES), age: clamp(p.age + randInt(-3, 3), 18, 60), job: pick(JOBS), chem: randInt(1, 5) }));
          return 'Du triffst ein paar interessante Menschen. Wen sprichst du an?';
        })}
      </div>`;
  }
  const vacCost = Math.max(0.003, S.money * 0.03);
  const kids = l.children.length ? `<p class="muted">Kinder: ${l.children.map(c => `${esc(c.name)} (${Math.max(0, S.year - c.born)} J.)`).join(', ')}</p>` : '';
  return `
  <section class="card">
    <details${S.lifeMsg ? ' open' : ''}><summary>Privatleben &amp; Aktivitäten · ${esc(lifeText())}</summary>
      ${S.lifeMsg ? `<div class="result">${S.lifeMsg}</div>` : ''}
      <h3>Beziehung</h3>
      ${rel}
      ${kids}
      <h3>Aktivitäten</h3>
      <div class="lifeacts">
        ${actBtn('vacation', 'Urlaub machen', money(vacCost), () => 'Sonne tanken und abschalten.' + mod({ form: 3, injuryProne: -2, rel: 8, money: -vacCost }))}
        ${actBtn('party', 'Party-Nacht', 'Beliebtheit, aber riskant', () => chance(0.8)
          ? 'Legendäre Nacht! Die Fotos gehen viral.' + mod({ popularity: 4, form: -2, rel: -5 })
          : 'Die Party endet mit einer Schlägerei. Der Verein ist stinksauer.' + mod({ popularity: -3, trust: -8, form: -2, rel: -10 }))}
        ${pre && !S.youth ? actBtn('doping', '💉 Dubiosen Arzt besuchen', 'Stärke +4 bis +6 · Risiko: Sperre oder Gefängnis', () => doDope(), 'risky') : ''}
      </div>
    </details>
  </section>`;
}

function renderFinance(f) {
  if (!f) return '';
  const row = (label, v, cls = '') => `<li><span>${label}</span><b class="${cls}">${v < 0 ? '' : '+'}${money(v)}</b></li>`;
  return `
    <h3>Finanzen</h3>
    <ul class="facts money">
      <li><span>Gehalt (brutto)</span><b>${money(f.gross)}</b></li>
      ${f.bonusPay ? `<li><span>Titel- und Erfolgsprämien (brutto)</span><b>${money(f.bonusPay)}</b></li>` : ''}
      ${f.sponsor >= 0.001 ? `<li><span>Werbeverträge (brutto)</span><b>${money(f.sponsor)}</b></li>` : ''}
      ${f.agentFee ? `<li><span>Beraterprovision (10 %)</span><b class="down">−${money(f.agentFee)}</b></li>` : ''}
      ${row('Nach Steuern (45 %)', f.net, 'up')}
      ${f.upkeep ? row('Unterhalt für Besitz', -f.upkeep, 'down') : ''}
      ${f.fund ? row('Rendite Fonds', f.fund, f.fund >= 0 ? 'up' : 'down') : ''}
      ${f.business !== undefined ? row('Gewinn deiner Firmen', f.business, f.business >= 0 ? 'up' : 'down') : ''}
      ${f.living ? row('Miete und Haustiere', -f.living, 'down') : ''}
      <li class="sum"><span>Vermögen jetzt</span><b>${money(S.money)}</b></li>
    </ul>`;
}

function renderShop() {
  const groups = {};
  for (const it of SHOP) (groups[it.cat] = groups[it.cat] || []).push(it);
  const owned = SHOP.filter(it => ownedCount(it.id)).map(it => `${esc(it.name)}${ownedCount(it.id) > 1 ? ` ×${ownedCount(it.id)}` : ''}`);
  const items = Object.entries(groups).map(([cat, list]) => `
    <div class="shopcat"><h4>${esc(cat)}</h4>
      ${list.map(it => {
        const have = ownedCount(it.id);
        const can = S.money >= it.price && (it.repeat || !have);
        const extra = it.id === 'fund' && have ? btn('Verkaufen', () => { sellFund(); render(true); }, 'small') : '';
        return `<div class="shopitem"><div><strong>${esc(it.name)}</strong><small>${money(it.price)}${it.upkeep ? ` · Unterhalt ${money(it.price * it.upkeep)}/Jahr` : ''}${it.pop ? ` · Beliebtheit +${it.pop}` : ''}${it.id === 'fund' ? ' · Rendite schwankt jedes Jahr' : ''}</small></div>
          <div class="shopbtns">${!it.repeat && have ? '<span class="owned">Gekauft</span>' : btn('Kaufen', () => { if (can) { buy(it); render(true); } }, can ? 'small' : 'small disabled')}${extra}</div></div>`;
      }).join('')}
    </div>`).join('');
  return `
  <section class="card">
    <details><summary>Vermögen &amp; Besitz · ${money(S.money)}</summary>
      <p class="muted">${owned.length ? `Dein Besitz: ${owned.join(', ')}.` : 'Du besitzt noch nichts Besonderes.'} Insgesamt hast du bisher ${money(S.earned)} netto verdient.</p>
      <div class="shop">${items}</div>
    </details>
  </section>`;
}

function totals() {
  const pro = S.history.filter(h => !h.youth && !h.banned);
  return {
    seasons: pro.length,
    games: pro.reduce((s, h) => s + h.games, 0),
    goals: pro.reduce((s, h) => s + h.goals, 0),
    assists: pro.reduce((s, h) => s + h.assists, 0),
  };
}

function renderHistory() {
  if (!S.history.length) return '';
  const rows = S.history.map(h => `
    <tr><td>${seasonLabel(h.year)}</td><td>${h.age}</td><td class="club">${esc(h.club)}${h.loan ? ' (L)' : ''}${h.youth ? ' (U19)' : ''}</td>
    <td>${h.games}</td><td>${h.goals}</td><td>${h.assists}</td><td>${h.note === null ? '–' : fmt2(h.note)}</td><td>${h.rating}</td><td>${h.titles ? '🏆'.repeat(Math.min(h.titles, 4)) : ''}</td></tr>`).join('');
  const t = totals();
  return `
  <section class="card">
    <details${S.phase === 'retired' ? ' open' : ''}><summary>Karriereverlauf (${t.games} Spiele, ${t.goals} Tore, ${t.assists} Vorlagen)</summary>
      <div class="scroll"><table>
        <thead><tr><th>Saison</th><th>Alter</th><th>Verein</th><th>Sp</th><th>T</th><th>V</th><th>Note</th><th>Stä</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${S.titles.length ? `<h3>Titel (${S.titles.length})</h3><ul class="lines">${S.titles.map(x => `<li>🏆 ${esc(x)}</li>`).join('')}</ul>` : ''}
      ${S.awards.length ? `<h3>Auszeichnungen (${S.awards.length})</h3><ul class="lines">${S.awards.map(x => `<li>⭐ ${esc(x)}</li>`).join('')}</ul>` : ''}
      ${S.milestones && S.milestones.length ? `<h3>Meilensteine (${S.milestones.length})</h3><ul class="lines">${S.milestones.map(m => `<li>🎖️ ${esc(m.text)} (${seasonLabel(m.year)})</li>`).join('')}</ul>` : ''}
    </details>
  </section>`;
}

function legacyScore() {
  const t = totals();
  const bd = S.awards.filter(a => a.startsWith("Ballon d'Or")).length;
  return Math.round(S.peak * 1.2 + S.titles.length * 3 + S.awards.length * 4 + bd * 15 + t.goals * 0.05 + S.player.caps * 0.1
    + (S.coachDone ? S.coachDone.titles.length * 2 : 0) + (S.ownerDone ? S.ownerDone.titles.length : 0));
}
function legacy() {
  const score = legacyScore();
  if (score >= 190) return ['🐐', 'G.O.A.T.', 'Du bist einer der größten Spieler aller Zeiten.'];
  if (score >= 150) return ['👑', 'Weltstar', 'Deine Karriere wird noch Jahrzehnte später erzählt.'];
  if (score >= 125) return ['⭐', 'Nationalheld', 'Du hast Fußballgeschichte in deinem Land geschrieben.'];
  if (score >= 105) return ['💪', 'Solider Profi', 'Eine starke Karriere, auf die du stolz sein kannst.'];
  return ['🙂', 'Wandervogel', 'Nicht jeder wird ein Superstar – aber du hast deinen Traum gelebt.'];
}

function renderDynasty() {

      <tbody>${all.map(d => `<tr><td>${d.gen}</td><td class="club">${esc(d.name)}${d.ballon ? ` · ${d.ballon}× Ballon d'Or` : ''}</td><td>${d.games}</td><td>${d.goals}</td><td>${d.titles}</td><td>${d.peak}</td></tr>`).join('')}</tbody>

function init() {
  const hb = document.getElementById('help-btn');
  if (hb) hb.addEventListener('click', toggleHelp);
  const tb = document.getElementById('theme-btn');
  if (tb) tb.addEventListener('click', toggleTheme);
  const sb = document.getElementById('sound-btn');
  if (sb) sb.addEventListener('click', toggleSound);
  applyTheme();
  app().addEventListener('click', e => {
    const b = e.target.closest('[data-h]');
    if (!b) return;
    const fn = handlers[+b.dataset.h];
    if (fn) fn();
  });
  render();
}

else setTimeout(init);

// Beteiligte Personen einmal pro Ereignis festlegen
function sibling() {
  if (ctx().sib === undefined) ctx().sib = randInt(0, family().siblings.length - 1);
  return family().siblings[ctx().sib];
}
function mate() {
  if (ctx().mate === undefined) ctx().mate = randInt(0, S.team.mates.length - 1);
  return S.team.mates[ctx().mate];
}
function enemyMate() {
  if (ctx().enemy === undefined) {
    const m = S.team.mates;
    ctx().enemy = m.indexOf(m.slice().sort((x, y) => x.rel - y.rel)[0]);
  }
  return S.team.mates[ctx().enemy];
}

// Name eines großen Vereins aus einer anderen Liga (einmal pro Ereignis festgelegt)
function bigClub() {
  if (!ctx().big) {
    const own = S.clubs[S.clubId].league;
    const pool = Object.keys(S.clubs).filter(n => S.clubs[n].league !== own && clubStr(n) >= Math.max(S.player.rating, 78));
    ctx().big = pool.length ? pick(pool) : pick(Object.keys(S.clubs).filter(n => n !== S.clubId));
  }
  return ctx().big;
}
function partnerName() {
  if (!ctx().partner) ctx().partner = pick(PARTNER_NAMES);
  return ctx().partner;
}

// Betrag für Geld-Ereignisse: 15 % des Vermögens, einmal pro Ereignis festgelegt
function stake() {
  if (ctx().stake === undefined) ctx().stake = Math.max(0.01, Math.round(S.money * 0.15 * 1000) / 1000);
  return ctx().stake;
}
function dealSize() {
  return Math.round(clamp(0.02 * Math.exp((S.player.rating - 65) / 8) * (0.5 + S.player.popularity / 100), 0.005, 10) * 1000) / 1000;
}

// ---------- Rivale ----------
function initRival() {
  const p = S.player;
  S.rival = {
    name: randomName(), nation: chance(0.5) ? p.nation : pick(NATIONS).name, pos: p.pos, age: p.age,
    rating: p.rating + randInt(-2, 3), potential: clamp(p.potential + randInt(-4, 4), 75, 99),
    club: pick(Object.keys(S.clubs).filter(n => n !== S.clubId && clubStr(n) >= 70)),
    games: 0, goals: 0, titles: 0, ballon: 0, retired: false, wins: 0, losses: 0, last: null,
  };
}
const rivalActive = () => S.rival && !S.rival.retired;

function rivalSeason(res) {
  const r = S.rival;
  if (!r || r.retired) return;
  const a = r.age;
  let g = a <= 19 ? 5 : a <= 22 ? 3.5 : a <= 25 ? 1.5 : a <= 28 ? 0.5 : a <= 30 ? -0.7 : a <= 32 ? -1.8 : -3.5;
  if (g > 0 && r.rating >= r.potential) g *= 0.15;
  r.rating = clamp(r.rating + g + rand(-1.2, 1.5), 40, 99);
  const str = clubStr(r.club);
  const games = r.age < 18 ? 0 : randInt(26, 48);
  const q = clamp(0.5 + (r.rating - 72) * 0.035 + (r.rating - str) * 0.02, 0.15, 1.8);
  const goals = Math.round(games * POSITIONS[r.pos].goals * q * rand(0.8, 1.2));
  r.games += games; r.goals += goals;
  const title = games > 0 && chance(sigmoid((str - 84) / 3) * 0.6);
  if (title) r.titles++;
  r.last = { games, goals, club: r.club, title };
  if (games) res.lines.push(`🆚 Dein Rivale ${r.name} (${r.club}): ${games} Spiele, ${goals} Tore${title ? ', holt einen Titel' : ''}, Stärke ${Math.round(r.rating)}.`);
  r.age++;
  if (chance(0.3)) {
    const cands = Object.keys(S.clubs).filter(n => n !== r.club && n !== S.clubId && Math.abs(clubStr(n) - r.rating) <= 4);
    if (cands.length) { r.club = pick(cands); res.lines.push(`🆚 ${r.name} wechselt zu ${r.club}.`); }
  }
  if ((r.age >= 35 && chance(0.4)) || r.age >= 38) { r.retired = true; res.lines.push(`👋 Dein ewiger Rivale ${r.name} beendet die Karriere.`); }
}

// Wertung des Rivalen für den Ballon d'Or
function rivalBallonScore() {
  if (!rivalActive() || !S.rival.last || !S.rival.last.games) return 0;
  return S.rival.rating + rand(-1, 4) + (S.rival.last.title ? 1.5 : 0);
}

// ---------- Familie ----------
function makeSibling(ageBase) {
  const brother = chance(0.5);
  const footballer = chance(0.4);
  return {
    name: pick(brother ? BROTHER_NAMES : SISTER_NAMES), brother, age: clamp(ageBase + randInt(-5, 5), 3, 60),
    footballer, rating: footballer ? randInt(45, 56) : 0, club: null, rel: 60,
  };
}
function initFamily(heir) {
  if (heir && heir.family) { S.family = heir.family; return; }
  S.family = {
    parents: [
      { role: 'Vater', name: pick(['Thomas', 'Michael', 'Stefan', 'Andreas', 'Frank', 'Carlos', 'Ahmet', 'Marco']), age: randInt(40, 50), alive: true, rel: 70 },
      { role: 'Mutter', name: pick(['Sabine', 'Andrea', 'Petra', 'Claudia', 'Maria', 'Ayşe', 'Elena', 'Nicole']), age: randInt(38, 48), alive: true, rel: 75 },
    ],
    siblings: Array.from({ length: randInt(0, 2) }, () => makeSibling(S.player.age)),
  };
}
function family() {
  if (!S.family) initFamily(null);
  return S.family;
}
const sibWord = s => (s.brother ? 'Bruder' : 'Schwester');
const sibPossessive = s => (s.brother ? 'Dein Bruder' : 'Deine Schwester');

function familySeason(res) {
  const f = family();
  for (const par of f.parents) {
    if (!par.alive) continue;
    par.age++;
    par.rel = clamp(par.rel - 4, 0, 100);
    if (par.age > 68 && chance((par.age - 68) * 0.03)) {
      par.alive = false;
      S.player.form = clamp(S.player.form - 3, -10, 10);
      res.lines.push(`🕊️ ${par.role === 'Elternteil' ? 'Dein Elternteil' : par.role === 'Vater' ? 'Dein Vater' : 'Deine Mutter'} ${par.name} ist mit ${par.age} Jahren gestorben. Die ganze Mannschaft trägt Trauerflor.`);
    }
  }
  for (const s of f.siblings) {
    s.age++;
    s.rel = clamp(s.rel - 3, 0, 100);
    if (!s.footballer || s.age < 17) continue;
    if (!s.club) {
      s.club = pick(Object.keys(S.clubs).filter(n => clubStr(n) <= 66));
      res.lines.push(`⚽ ${sibPossessive(s)} ${s.name} unterschreibt ${s.brother ? 'einen Profivertrag bei' : 'beim Frauenteam von'} ${s.club}!`);
    }
    const g = s.age <= 22 ? 3 : s.age <= 27 ? 0.8 : s.age <= 31 ? -0.5 : -2.5;
    s.rating = clamp(s.rating + g + rand(-1, 1.5), 40, 95);
    if (chance(0.25)) {
      const c = Object.keys(S.clubs).filter(n => Math.abs(clubStr(n) - s.rating) <= 4);
      if (c.length) s.club = pick(c);
    }
    if (s.age >= 34) { s.footballer = false; res.lines.push(`${sibPossessive(s)} ${s.name} beendet die Fußballkarriere.`); }
  }
}

  if (best) {

// Gewinne und Pleiten am Saisonende; gibt den Gesamtgewinn zurück
function businessSeason(res) {
  let total = 0;
  for (const b of businesses().slice()) {
    const t = bizType(b.type);
    if (chance(t.fail)) {
      S.businesses = S.businesses.filter(x => x !== b);
      res.lines.push(`📉 Deine Firma „${t.name}“ ist pleite. Das investierte Geld ist weg.`);
      continue;
    }
    const profit = b.value * rand(t.min, t.max);
    b.value = Math.max(0.01, b.value * rand(0.95, 1.18));
    b.last = profit;
    total += profit;
  }
  S.money += total;
  return total;
}

function ownerSeason() {
  const o = S.owner, club = o.club, L = clubLeague(club);
  const value = clubPrice(club);
  const investAmt = Math.min(Math.max(0, S.money), { none: 0, small: value * 0.1, big: value * 0.3 }[o.invest]);
  S.money -= investAmt;
  S.clubs[club].base = Math.max(S.clubs[club].base, Math.min(92, S.clubs[club].base + (investAmt / Math.max(1, value)) * 12));
  const ticketF = { cheap: 0.7, normal: 1, high: 1.35 }[o.tickets];
  const fanBonus = o.tickets === 'cheap' ? 0.05 : o.tickets === 'high' ? -0.04 : 0;
  const europe = europeFor(club);
  const tables = worldSeason(club, fanBonus);
  const rows = tables[L.id].rows;
  const pos = rows.findIndex(r => r.name === club) + 1;
  const lines = [`${L.name}: ${club} wird ${pos}. von ${rows.length}.`];
  const titles = [];
  if (pos === 1) titles.push(L.champion);
  const comps = managerCups(club, clubStr(club), europe, lines, titles);
  const revenue = value * 0.05 * ticketF + titles.length * value * 0.03 + (comps.europe ? value * 0.02 : 0);
  const costs = value * rand(0.03, 0.06);
  const profit = revenue - costs;
  S.money += profit;
  lines.push(`Finanzen: Einnahmen ${money(revenue)}, Kosten ${money(costs)}, Investition ${money(investAmt)}.`);
  titles.forEach(t => { lines.push(`🏆 ${t}!`); o.titles.push(`${t} (${seasonLabel(S.year)})`); });
  o.seasons.push({ year: S.year, pos, teams: rows.length, league: L.name, titles: titles.length, profit: profit - investAmt });
  o.last = { lines, table: rows.map(r => ({ name: r.name, pts: r.pts })) };
  S.year++;
  S.player.age++;
}

// Trainerkarriere und gemeinsame Saison-Simulation für Trainer und Präsident

// Simuliert alle Ligen, Auf-/Abstieg und Stärke-Schwankungen
function worldSeason(ownClub, bonus) {
  const tables = {};
  for (const lg of LEAGUES) tables[lg.id] = simLeague(lg.id, ownClub, bonus);
  for (const lg of LEAGUES) S.lastTables[lg.id] = tables[lg.id].rows.map(r => r.name);
  S.lastTables[PROMOTION.lower].slice(0, PROMOTION.count).forEach(n => { S.clubs[n].league = PROMOTION.upper; });
  S.lastTables[PROMOTION.upper].slice(-PROMOTION.count).forEach(n => { S.clubs[n].league = PROMOTION.lower; });
  for (const n of Object.keys(S.clubs)) S.clubs[n].drift = S.clubs[n].drift * 0.6 + rand(-2.5, 2.5);
  return tables;
}

// Pokal und internationaler Wettbewerb eines Vereins ohne Spielerbezug
function managerCups(club, ownStr, europe, lines, titles) {
  const L = clubLeague(club);
  const pool = Object.keys(S.clubs).filter(n => n !== club && clubLeague(n).country === L.country).map(n => ({ name: n, str: clubStr(n) }));
  const cup = knockout(ownStr, ['1. Runde', '2. Runde', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'], pool, 4.5, true);
  if (cup.won) titles.push(`${L.cup}-Sieger`);
  else lines.push(`${L.cup}: Aus in der Runde „${cup.reached}“ gegen ${cup.lostTo}.`);
  let eu = null;
  if (europe) {
    const name = euroName(club, europe);
    const ep = euroPool(club, europe);
    const avg = ep.reduce((s, x) => s + x.str, 0) / Math.max(1, ep.length);
    if (!chance(sigmoid((ownStr - (avg - 3)) / 3.5))) lines.push(`${name}: Aus in der Ligaphase.`);
    else {
      eu = knockout(ownStr, ['K.-o.-Playoffs', 'Achtelfinale', 'Viertelfinale', 'Halbfinale', 'Finale'], ep, 4.5);
      if (eu.won) titles.push(`${name}-Sieger`);
      else lines.push(`${name}: Aus in der Runde „${eu.reached}“ gegen ${eu.lostTo}.`);
    }
  }
  return { cup, europe: !!europe };
}

  const fame = clamp((S.peak - 70) * 0.5 + S.titles.length * 0.5, 0, 25);
  S.coach = {
    club: null, skill: Math.round(45 + fame), seasons: [], titles: [], fired: 0,
    tactic: 'balanced', policy: 'normal', bonus: 0, board: 0, event: null, last: null,
  };
  S.coachOffers = coachOffersFor(56, 62 + fame * 0.4, 3);
  S.phase = 'coachOffers';
}

function coachOffersFor(lo, hi, k) {
  const c = Object.keys(S.clubs).filter(n => n !== (S.coach && S.coach.club) && clubStr(n) >= lo && clubStr(n) <= hi);
  return shuffle(c).slice(0, k).sort((a, b) => clubStr(b) - clubStr(a));
}

function signCoach(club) {
  S.coach.club = club;
  S.coach.board = 0;
  S.coachOffers = null;
  newCoachSeason();
}

function newCoachSeason() {
  const c = S.coach;
  if (c.nextBoost) { S.clubs[c.club].base += c.nextBoost; c.nextBoost = 0; }
  c.bonus = 0;
  c.event = { i: randInt(0, COACH_EVENTS.length - 1), result: null };
  c.europe = europeFor(c.club);
  S.phase = 'coach';
}

function coachSeason() {
  const c = S.coach, club = c.club, L = clubLeague(club);
  const expected = clubsIn(L.id).sort((a, b) => clubStr(b) - clubStr(a)).indexOf(club) + 1;
  const str = clubStr(club);
  const avg = clubsIn(L.id).reduce((s, n) => s + clubStr(n), 0) / clubsIn(L.id).length;
  let bonus = c.bonus + (c.skill - 60) * 0.012;
  if (c.tactic === 'offensive') bonus += str > avg ? 0.1 : -0.06;
  if (c.tactic === 'defensive') bonus += str < avg ? 0.07 : -0.03;
  if (c.tactic === 'pressing') bonus += chance(0.7) ? 0.12 : -0.12;
  if (c.policy === 'star') S.clubs[club].base += 2;
  if (c.policy === 'youth') c.nextBoost = (c.nextBoost || 0) + 2;
  const tolerance = c.board + (c.policy === 'save' ? 3 : 0) - (c.policy === 'star' ? 2 : 0);
  const tables = worldSeason(club, bonus);
  const rows = tables[L.id].rows;
  const pos = rows.findIndex(r => r.name === club) + 1;
  const lines = [`${L.name}: ${club} wird ${pos}. von ${rows.length} (erwartet: ${expected}.).`];
  const titles = [];
  if (pos === 1) titles.push(L.champion);
  managerCups(club, clubStr(club) + (c.skill - 60) * 0.1, c.europe, lines, titles);
  titles.forEach(t => { lines.push(`🏆 ${t}!`); c.titles.push(`${t} (${seasonLabel(S.year)})`); });
  const diff = expected - pos + tolerance;
  let fired = false;
  if (diff <= -5 && !titles.length) { fired = true; c.fired++; lines.push(`❌ Der Vorstand ist unzufrieden und entlässt dich.`); }
  else if (diff >= 3 || titles.length) lines.push('👏 Der Vorstand ist begeistert von deiner Arbeit.');
  c.skill = clamp(c.skill + 1 + titles.length + (diff > 0 ? 1 : 0), 30, 99);
  c.seasons.push({ year: S.year, club, league: L.name, pos, teams: rows.length, titles: titles.length, fired });
  const success = diff + titles.length * 3;
  const hi = clubStr(club) + (fired ? -4 : 2 + clamp(success, 0, 8)) + (c.skill - 60) * 0.1;
  const offers = coachOffersFor(clubStr(club) - (fired ? 14 : 3), hi, fired ? randInt(0, 2) : randInt(0, 3));
  c.last = { lines, fired, offers, table: rows.map(r => ({ name: r.name, pts: r.pts })) };
  S.year++;
  S.player.age++;
  S.phase = 'coachEnd';
}

function endCoaching(reason) {
  const c = S.coach;
  const seasons = c.seasons.length;
  S.after = `${reason} In ${seasons} ${seasons === 1 ? 'Saison' : 'Saisons'} als Trainer gewinnst du ${c.titles.length} Titel.`;
  S.coachDone = { titles: c.titles.slice(), seasons, clubs: [...new Set(c.seasons.map(x => x.club))] };
  S.phase = 'retired';
  saveHallOfFame();
}

];

function milestones() { if (!S.milestones) S.milestones = []; return S.milestones; }
function addMilestone(id, text, res) {
  if (milestones().some(m => m.id === id)) return;
  S.milestones.push({ id, text, year: S.year });
  res.milestones = res.milestones || [];
  res.milestones.push(text);
}

function checkMilestones(res) {
  if (res.role === 'U19') return;
  const t = totals();
  for (const m of MILESTONES) if (m.test(t)) addMilestone(m.id, m.text, res);
  if (res.goals >= 30) addMilestone('season30', `${res.goals} Tore in einer Saison`, res);
  if (res.goals >= 45) addMilestone('season45', 'Über 45 Saisontore – Weltrekord-Verdächtig', res);
  if (res.goals > 0 && res.age <= 18) addMilestone('young', `Profitor mit nur ${res.age} Jahren`, res);
  // Vereinslegende
  for (const l of legends()) addMilestone(`legend_${l.club}`, `Vereinslegende bei ${l.club}`, res);
  const club = clubStats().find(c => c.club === res.club);
  if (club && club.games >= 100) addMilestone(`club100_${club.club}`, `100 Spiele für ${club.club}`, res);
}

// Statistiken pro Verein aus dem Karriereverlauf
function clubStats() {
  const map = {};
  for (const h of S.history) {
    if (h.youth || h.banned || h.loan) continue;
    const c = map[h.club] = map[h.club] || { club: h.club, seasons: 0, games: 0, goals: 0, titles: 0 };
    c.seasons++; c.games += h.games; c.goals += h.goals; c.titles += h.titles;
  }
  return Object.values(map);
}
function legends() {
  return clubStats().filter(c => c.seasons >= 5 || c.games >= 180).map(c => ({
    ...c,
    honors: [
      'Abschiedsspiel vor ausverkauftem Stadion',
      ...(c.titles >= 4 || c.goals >= 120 ? ['Statue vor dem Stadion'] : []),
      ...(c.seasons >= 8 || c.games >= 300 ? [`Rückennummer ${S.player.number} wird nie wieder vergeben`] : []),
    ],
  }));
}

function renderLegends() {
  const ls = legends();
  if (!ls.length) return '';
  return `
  <section class="card">
    <h2>Vereinslegende</h2>
    ${ls.map(l => `<div class="legend">${crest(l.club)}<div><strong>${esc(l.club)}</strong>
      <small>${l.seasons} Saisons · ${l.games} Spiele · ${l.goals} Tore · ${l.titles} Titel</small>
      <ul class="lines">${l.honors.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div></div>`).join('')}

}

// ---------- Ruhmeshalle ----------
function loadHallOfFame() { try { return JSON.parse(localStorage.getItem(HOF_KEY) || '[]'); } catch (e) { return []; } }
function saveHallOfFame() {
  if (!S || !S.player) return;
  if (!S.hofId) S.hofId = `${Date.now()}-${randInt(0, 99999)}`;
  const t = totals();
  const [, title] = legacy();
  const entry = {
    id: S.hofId, name: S.player.name, nation: S.player.nation, pos: S.player.pos, peak: S.peak, games: t.games, goals: t.goals,
    titles: S.titles.length, ballon: S.awards.filter(a => a.startsWith("Ballon d'Or")).length, money: S.money, title,
    gen: S.gen || 1, score: legacyScore(), coachTitles: S.coachDone ? S.coachDone.titles.length : 0, doping: S.dopeCaught || 0,
  };
  const list = loadHallOfFame().filter(e => e.id !== entry.id);
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  try { localStorage.setItem(HOF_KEY, JSON.stringify(list.slice(0, 50))); } catch (e) { /* ignorieren */ }
}

function renderHallOfFame() {
  const list = loadHallOfFame();
  if (!list.length) return '';
  return `
  <section class="card">
    <h2>Ruhmeshalle</h2>

// ---------- Elfmeterschießen ----------
// Titel nach einem gewonnenen Finale vergeben
function grantFinalTitle(so, how) {
  const res = S.seasonEnd;
  const label = so.kind === 'nation' ? so.title : `${so.title} (${seasonLabel(S.year)})`;
  S.titles.push(label);
  res.titles.push(so.title);
  res.lines.push(`🏆 ${so.title}! ${how}.`);
  const h = S.history[S.history.length - 1];
  if (h) h.titles++;
  S.player.popularity = clamp(S.player.popularity + (so.title.startsWith('Champions') ? 12 : 8), 0, 100);
  S.money += S.contract.salary * 0.15 * 0.55;
  queueFx('fanfare', 'confetti');
}

function resolveShootout(dir) {
  const so = S.shootouts[0];
  const res = S.seasonEnd;
  const gk = S.player.pos === 'TW';
  const q = quality();
  const other = randInt(0, 2);
  let ok;
  if (gk) ok = other === dir ? chance(0.6 + q * 0.25) : chance(0.05);
  else ok = other !== dir ? chance(0.9 + q * 0.08) : chance(0.12 + q * 0.12);
  const dirs = ['links', 'in die Mitte', 'rechts'];
  if (ok) {
    so.text = gk
      ? (other === dir ? `Der Schütze zielt ${dirs[other]} – und du bist da! GEHALTEN! Ihr gewinnt das Elfmeterschießen!`
        : 'Du springst in die falsche Ecke – aber der Ball knallt an die Latte! Ihr gewinnt das Elfmeterschießen!')
      : (other === dir ? `Der Torwart ahnt die Ecke, aber dein Schuss ist zu scharf – drin! Ihr gewinnt das Elfmeterschießen!`
        : `Der Torwart springt ${dirs[other]}, du schiebst ${dirs[dir]} ein. Ihr gewinnt das Elfmeterschießen!`);
    grantFinalTitle(so, `Finale gegen ${so.opp} im Elfmeterschießen gewonnen`);
    setHeadline(`ELFMETER-HELD ${lastName()}! ${so.title.toUpperCase()}!`);
  } else {
    queueFx('sad');
    so.text = gk
      ? (other === dir ? 'Du bist in der richtigen Ecke, aber der Schuss ist zu platziert. Ihr verliert das Elfmeterschießen.'
        : `Du springst in die falsche Ecke, der Ball geht ${dirs[other]} rein. Ihr verliert das Elfmeterschießen.`)
      : (other === dir ? 'Der Torwart ahnt die Ecke und hält! Ihr verliert das Elfmeterschießen.'
        : 'Du schießt neben das Tor! Ihr verliert das Elfmeterschießen.');
    res.lines.push(`Finale gegen ${so.opp} im Elfmeterschießen verloren.`);
    S.player.popularity = clamp(S.player.popularity - 3, 0, 100);
  }
  so.done = ok ? 'won' : 'lost';
}

function renderShootout() {
  const so = S.shootouts[0];
  const gk = S.player.pos === 'TW';
  const dirs = gk ? ['Links springen', 'In der Mitte bleiben', 'Rechts springen'] : ['Links unten', 'Mitte', 'Rechts oben'];
  return `
  <section class="card">
    <div class="scoreboard">
      <div class="comp">Finale · Elfmeterschießen</div>
      <div class="teams">
        <div class="team">${S.clubId && so.kind !== 'nation' ? crest(S.clubId) : '⚽'}<span>${esc(so.kind === 'nation' ? S.player.nation : S.clubId)}</span></div>
        <div class="score">4:4<small>Elfmeterschießen</small></div>
        <div class="team">${so.kind !== 'nation' ? crest(so.opp) : '⚽'}<span>${esc(so.opp)}</span></div>
      </div>
    </div>
    <p class="situation">Um den Titel „${esc(so.title)}“: Nach 120 Minuten steht es unentschieden. ${gk
      ? 'Der letzte Schütze des Gegners läuft an. Hältst du, seid ihr Sieger!'
      : 'Du trittst als letzter Schütze an. Triffst du, habt ihr den Titel!'}</p>
    ${so.done
      ? `<div class="result"><p>${esc(so.text)}</p></div><div class="actions">${btn('Weiter', () => {
        S.shootouts.shift();
        if (!S.shootouts.length) S.phase = 'seasonEnd';
        render();
      }, 'primary')}</div>`
      : `<div class="choices">${dirs.map((d, i) => btn(esc(d), () => { resolveShootout(i); render(); })).join('')}</div>`}
  </section>`;
}

const SLOT_COUNT = 3;
const slotKey = n => `fussballkarriere-slot-${n}`;
let pendingSlot = 1;
let slotConfirm = null;

function readSlot(n) {
  try {
    // Alten Einzelspielstand einmalig in Slot 1 übernehmen
    if (n === 1 && !localStorage.getItem(slotKey(1))) {
      const old = localStorage.getItem('fussballkarriere-save-v2');
      if (old) { localStorage.setItem(slotKey(1), old); localStorage.removeItem('fussballkarriere-save-v2'); }
    }
    const r = localStorage.getItem(slotKey(n));
    return r ? JSON.parse(r) : null;
  } catch (e) { return null; }
}
function writeSlot(n, data) { try { localStorage.setItem(slotKey(n), JSON.stringify(data)); } catch (e) { /* ignorieren */ } }
function clearSlot(n) { try { localStorage.removeItem(slotKey(n)); } catch (e) { /* ignorieren */ } }

function renderSlots() {
  const rows = [];
  for (let n = 1; n <= SLOT_COUNT; n++) {
    const d = readSlot(n);
    let info = '<span class="muted">Leer</span>';
    if (d && d.player) {
      const what = d.phase === 'retired' ? 'Karriere beendet' : d.phase && d.phase.startsWith('coach') ? 'Trainer' : d.phase === 'owner' ? 'Präsident' : (d.clubId || 'Akademie');
      info = `<strong>${esc(d.player.name)}</strong><small>${d.player.age} Jahre · ${esc(what)} · Stärke ${Math.round(d.peak || d.player.rating)}${d.gen > 1 ? ` · Gen. ${d.gen}` : ''}</small>`;
    }
    const confirm = slotConfirm === n;
    rows.push(`<div class="slot">
      <div class="slotnum">${n}</div>
      <div class="offer-info">${info}</div>
      <div class="shopbtns">
        ${d && d.player && d.phase !== 'create' ? btn('Weiter', () => { S = d; S.slot = n; render(); }, 'primary small') : ''}
        ${btn(d ? 'Neu' : 'Neue Karriere', () => {
          if (d && !confirm) { slotConfirm = n; render(true); return; }
          slotConfirm = null; clearSlot(n); pendingSlot = n; S = { phase: 'create' }; render();
        }, confirm ? 'small danger' : d ? 'small' : 'primary small')}
      </div>
      ${confirm ? `<p class="slotwarn">Achtung: Der alte Spielstand wird gelöscht. Zum Bestätigen nochmal auf „Neu“ tippen.</p>` : ''}
    </div>`);
  }
  return `<section class="card"><h2>Spielstände</h2><div class="slots">${rows.join('')}</div></section>`;
}

// ---------- Sound (ohne Dateien, mit Web Audio erzeugt) ----------
const PREF_KEY = 'fussballkarriere-einstellungen';
function prefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch (e) { return {}; } }
function setPref(k, v) { const p = prefs(); p[k] = v; try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (e) { /* ignorieren */ } }
let audioCtx = null;
let fxQueue = [];
function queueFx(...names) { fxQueue.push(...names); }
function flushFx() {
  const list = fxQueue; fxQueue = [];
  for (const n of list) {
    if (n === 'confetti') confetti();
    else playSound(n);
  }
}
function tone(freq, start, dur, type = 'sine', vol = 0.15) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime + start); o.stop(audioCtx.currentTime + start + dur + 0.05);
}
function crowd(dur) {
  const len = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len) * 0.5;
  const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  f.type = 'bandpass'; f.frequency.value = 900; g.gain.value = 0.35;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
}
function playSound(name) {
  if (prefs().mute) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (name === 'goal') { crowd(1.6); tone(523, 0, 0.15, 'square', 0.06); tone(784, 0.15, 0.3, 'square', 0.06); }
    else if (name === 'whistle') { tone(2900, 0, 0.18, 'sine', 0.08); tone(2900, 0.25, 0.45, 'sine', 0.08); }
    else if (name === 'fanfare') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.14, 0.4, 'triangle', 0.12));
    else if (name === 'chime') { tone(880, 0, 0.3, 'sine', 0.1); tone(1320, 0.12, 0.4, 'sine', 0.08); }
    else if (name === 'sad') { tone(392, 0, 0.35, 'triangle', 0.1); tone(330, 0.3, 0.5, 'triangle', 0.1); }
  } catch (e) { /* kein Ton möglich */ }
}

// ---------- Konfetti ----------
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.className = 'confetti';
  c.width = window.innerWidth; c.height = window.innerHeight;
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  const colors = ['#3ddc84', '#e8c547', '#ef5b5b', '#4aa3ff', '#ffffff'];
  const parts = Array.from({ length: 140 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3,
    r: 4 + Math.random() * 5, a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.3, col: colors[Math.floor(Math.random() * colors.length)],
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    }
    if (t - start < 3200) requestAnimationFrame(frame); else c.remove();
  })(start);
}

// ---------- Karriere-Diagramm ----------
function renderCareerChart() {
  const rows = S.history.filter(h => !h.banned);
  if (rows.length < 2) return '';
  const W = 340, H = 170, padL = 30, padR = 10, padT = 12, padB = 26;
  const ratings = rows.map(h => h.rating);
  const goals = rows.map(h => h.goals);
  const minR = Math.max(30, Math.floor((Math.min(...ratings) - 3) / 10) * 10);
  const maxR = Math.min(100, Math.ceil((Math.max(...ratings) + 3) / 10) * 10);
  const maxG = Math.max(10, ...goals);
  const x = i => padL + (i * (W - padL - padR)) / (rows.length - 1);
  const yR = v => padT + (1 - (v - minR) / (maxR - minR)) * (H - padT - padB);
  const yG = v => H - padB - (v / maxG) * (H - padT - padB) * 0.6;
  const bw = Math.max(3, Math.min(14, (W - padL - padR) / rows.length - 3));
  const ticks = [];
  for (let v = minR; v <= maxR; v += 10) ticks.push(v);
  const line = rows.map((h, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${yR(h.rating).toFixed(1)}`).join(' ');
  const area = `${line} L${x(rows.length - 1).toFixed(1)},${H - padB} L${x(0).toFixed(1)},${H - padB} Z`;
  const peakI = ratings.indexOf(Math.max(...ratings));
  const labelEvery = Math.ceil(rows.length / 6);
  return `
  <section class="card">
    <h2>Deine Karriere als Kurve</h2>
    <p class="muted"><span class="lg lg-r"></span> Stärke &nbsp; <span class="lg lg-g"></span> Tore pro Saison</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stärke und Tore pro Saison">
      ${ticks.map(v => `<line x1="${padL}" x2="${W - padR}" y1="${yR(v)}" y2="${yR(v)}" class="grid"/><text x="${padL - 4}" y="${yR(v) + 3}" class="axis" text-anchor="end">${v}</text>`).join('')}
      ${rows.map((h, i) => `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${yG(h.goals).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - padB - yG(h.goals)).toFixed(1)}" class="gbar"><title>${seasonLabel(h.year)}: ${h.goals} Tore</title></rect>`).join('')}
      <path d="${area}" class="rarea"/>
      <path d="${line}" class="rline"/>
      <circle cx="${x(peakI)}" cy="${yR(ratings[peakI])}" r="4" class="rpeak"><title>Höchste Stärke: ${ratings[peakI]}</title></circle>
      ${rows.map((h, i) => (i % labelEvery === 0 ? `<text x="${x(i)}" y="${H - 8}" class="axis" text-anchor="middle">${h.age}</text>` : '')).join('')}
    </svg>
    <p class="muted small">Unten: dein Alter.</p>
  </section>`;
}

function genSeasonGoals() {
  const p = S.player, se = S.season;
  if (S.youth) { se.goals = []; return; }
  const grp = POSITIONS[p.pos].group;
  const L = clubLeague(S.clubId);
  const expected = clubsIn(L.id).sort((a, b) => clubStr(b) - clubStr(a)).indexOf(S.clubId) + 1;
  const share = { 'Stammspieler': 0.85, 'Rotation': 0.55, 'Ergänzungsspieler': 0.25 }[se.role];
  const pool = [];
  const games = Math.max(5, Math.round((clubsIn(L.id).length - 1) * 2 * share * 0.9));
  pool.push({ type: 'games', target: games, text: `Mindestens ${games} Pflichtspiele` });
  if (grp === 'att' || grp === 'mid') {
    const g = Math.max(2, Math.round(games * POSITIONS[p.pos].goals * clamp(0.5 + (p.rating - 72) * 0.035, 0.2, 1.6)));
    pool.push({ type: 'goals', target: g, text: `Mindestens ${g} Tore` });
  }
  if (grp === 'mid' || p.pos === 'AV' || p.pos === 'FL') {
    const a = Math.max(2, Math.round(games * POSITIONS[p.pos].assists * 0.9));
    pool.push({ type: 'assists', target: a, text: `Mindestens ${a} Vorlagen` });
  }
  if (grp === 'gk') pool.push({ type: 'clean', target: Math.max(3, Math.round(games * 0.3)), text: `Mindestens ${Math.max(3, Math.round(games * 0.3))} Spiele zu null` });
  pool.push({ type: 'note', target: 3.0, text: 'Durchschnittsnote 3,0 oder besser' });
  pool.push({ type: 'pos', target: Math.max(1, expected - 1), text: expected <= 2 ? 'Meister werden' : `Mit dem Verein mindestens Platz ${Math.max(1, expected - 1)}` });
  if (se.role !== 'Stammspieler') pool.push({ type: 'starter', target: 1, text: 'Nächste Saison Stammspieler werden (Stärke steigern)' });
  se.goals = shuffle(pool).slice(0, 2);
}

function evalSeasonGoals(res) {
  const se = S.season;
  if (!se.goals || !se.goals.length) return;
  const results = se.goals.map(g => {
    let ok = false;
    if (g.type === 'games') ok = res.games >= g.target;
    else if (g.type === 'goals') ok = res.goals >= g.target;
    else if (g.type === 'assists') ok = res.assists >= g.target;
    else if (g.type === 'clean') ok = res.cleanSheets >= g.target;
    else if (g.type === 'note') ok = res.note !== null && res.note <= g.target;
    else if (g.type === 'pos') ok = res.pos <= g.target;
    else if (g.type === 'starter') ok = roleFor(S.player.rating, clubStr(S.clubId), S.player.trust) === 'Stammspieler';
    return { text: g.text, ok };
  });
  const done = results.filter(r => r.ok).length;
  if (done) {
    S.goalsDone = (S.goalsDone || 0) + done;
    S.player.popularity = clamp(S.player.popularity + 2 * done, 0, 100);
    S.player.trust = clamp(S.player.trust + 4 * done, 0, 100);
    S.money += S.contract.salary * 0.08 * done;
  }
  res.goalResults = results;
}

function renderGoalList(list, results) {
  if (!list || !list.length) return '';
  return `<ul class="goals">${list.map((g, i) => {
    const r = results && results[i];
    return `<li class="${r ? (r.ok ? 'ok' : 'fail') : ''}">${r ? (r.ok ? '✅' : '❌') : '🎯'} ${esc(g.text)}</li>`;
  }).join('')}</ul>`;
}

function nationalSeason(res) {
  const p = S.player, nat = nation();
  if (S.youth || p.age < 18 || S.fugitive || S.natRetired || p.rating < nat.str - 8 || res.games < 5) return;
  const games = randInt(4, 8);

  p.caps += games; p.intGoals += goals;
  res.lines.push(`🌍 Nationalmannschaft: ${games} Länderspiele${goals ? `, ${goals} Tore` : ''} (insgesamt ${p.caps} Spiele, ${p.intGoals} Tore).`);
  if (!S.natCaptain && p.caps >= 40 && p.age >= 26 && p.rating >= nat.str) {
    S.natCaptain = true;
    res.lines.push(`⭐ Du wirst Kapitän der Nationalmannschaft von ${nat.name}!`);

}

const SERIOUS_INJURIES = ['Kreuzbandriss', 'Achillessehnenriss', 'Schienbeinbruch', 'Knorpelschaden im Knie'];
function maybeSeriousInjury() {
  if (S.youth) return false;
  const p = 0.03 * (diff().injury / 8) + S.player.injuryProne / 700;
  if (!chance(p)) return false;
  S.current = { type: 'rehab', ctx: {}, injury: pick(SERIOUS_INJURIES), stage: 0, progress: 0, risk: 0, log: [], result: null };
  return true;
}
const REHAB_STAGES = ['Woche 1–6: Operation und erste Reha', 'Woche 7–14: Aufbautraining', 'Woche 15+: Zurück ins Mannschaftstraining'];
const REHAB_CHOICES = [
  { label: 'Vorsichtig', sub: 'Langsam, aber sicher', prog: 1, risk: 0 },
  { label: 'Normal', sub: 'Nach Plan', prog: 2, risk: 0.08 },
  { label: 'Volle Belastung', sub: 'Schnell zurück, hohes Risiko', prog: 3, risk: 0.2 },
];
function rehabStep(ch) {
  const c = S.current;
  c.progress += ch.prog; c.risk += ch.risk;
  c.log.push(`${REHAB_STAGES[c.stage]}: ${ch.label}`);
  c.stage++;
  if (c.stage < REHAB_STAGES.length) return;
  let missed = Math.round(30 - c.progress * 2.6);
  let text = `Du bist nach ${missed} verpassten Spielen zurück auf dem Platz!`;
  const eff = { injuredGames: missed, injuryProne: 2 };
  if (chance(c.risk)) {
    missed += 10;
    eff.injuredGames = missed;
    S.player.rating = clamp(S.player.rating - 3, 35, 99);
    text = `Rückschlag! Du hast zu früh zu viel gemacht. Insgesamt verpasst du ${missed} Spiele und verlierst an Stärke.`;
    queueFx('sad');
  }
  c.result = `<p>${text}</p>` + mod(eff);
}
function renderRehab() {
  const c = S.current;
  return `
  <section class="card">
    ${stepHeader()}
    <h2>🚑 ${esc(c.injury)}!</h2>
    <p>Eine schwere Verletzung. Wie gehst du die Reha an? Je schneller, desto größer das Risiko eines Rückschlags.</p>
    <div class="rehabbar">${REHAB_STAGES.map((st, i) => `<span class="${i < c.stage ? 'done' : i === c.stage && !c.result ? 'now' : ''}">${i + 1}</span>`).join('')}</div>
    ${c.log.length ? `<ul class="lines">${c.log.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
    ${c.result ? `<div class="result">${c.result}</div><div class="actions">${continueBtn()}</div>` : `
      <h3>${esc(REHAB_STAGES[c.stage])}</h3>
      <div class="choices">${REHAB_CHOICES.map(ch => btn(`${ch.label}<small>${ch.sub}</small>`, () => { rehabStep(ch); render(true); })).join('')}</div>`}
  </section>`;
}

// ---------- Gerichtsprozess ----------
function courtVerdict(lawyer) {
  const cs = S.court;
  const cost = { star: 0.15 + Math.max(0, S.money) * 0.03, normal: 0.01, confess: 0.005 }[lawyer];
  S.money -= cost;
  let text;
  const winP = { star: 0.7, normal: 0.35, confess: 0 }[lawyer];
  if (cs.plaintiff) {
    if (chance(winP + 0.15)) { const gain = 0.05 + S.player.popularity / 400; text = `Du gewinnst den Prozess und bekommst ${money(gain)} Schadenersatz.` + mod({ money: gain, popularity: 3 }); }
    else text = 'Das Gericht weist deine Klage ab.' + mod({ popularity: -2 });
  } else if (lawyer !== 'confess' && chance(winP)) {
    text = 'Freispruch! Du verlässt das Gericht erhobenen Hauptes.' + mod({ popularity: 2 });
  } else {
    const fine = (0.05 + Math.max(0, S.money) * 0.08) * cs.severity * (lawyer === 'confess' ? 0.5 : 1);
    text = `Schuldig. Du musst ${money(fine)} Strafe zahlen.` + mod({ money: -fine, popularity: lawyer === 'confess' ? -3 : -8, trust: -3 });
    if (cs.severity >= 2 && lawyer !== 'confess' && chance(0.35)) {
      S.ban = { type: 'prison', years: 1 };
      text += '<p>Außerdem verurteilt dich das Gericht zu einem Jahr Gefängnis. Nach der Saison musst du die Strafe antreten.</p>';
    }
  }
  S.court = null;
  return `<p>Anwaltskosten: ${money(cost)}.</p>` + text;
}

const lastName = () => S.player.name.trim().split(/\s+/).slice(-1)[0].toUpperCase();

// ---------- Live-Finale ----------
function opponentStrength(name) {
  if (S.clubs[name]) return clubStr(name);
  const nat = NATIONS.find(n => n.name === name);
  if (nat) return nat.str;
  for (const list of Object.values(EXTRA_OPPONENTS)) for (const [n, s] of list) if (n === name) return s;
  return 75;
}

// Ein erreichtes Finale wird live gespielt statt ausgewürfelt
function queueLiveFinal(r, kind, title, comp, ownStr) {
  if (!r || r.reached !== 'Finale') return false;
  const opp = r.won ? r.beat : r.lostTo;
  r.won = false; r.pending = true; r.lostTo = opp;
  S.finals = S.finals || [];
  S.finals.push({ kind, title, comp, opp, ownStr, oppStr: opponentStrength(opp), us: 0, them: 0, scene: 0, log: [], current: null, done: false });
  return true;
}

const FINAL_MINUTES = [23, 58, 84];
function poisson(l) { let k = 0, p = Math.exp(-l), s = p; const u = Math.random(); while (u > s && k < 8) { k++; p *= l / k; s += p; } return k; }

// Tore der Mitspieler zwischen den Szenen
function simChunk(f, minuteFrom, minuteTo) {
  const share = (minuteTo - minuteFrom) / 90;
  const diffS = (f.ownStr - f.oppStr) / 12;
  const gUs = poisson(1.25 * Math.exp(diffS) * share), gThem = poisson(1.25 * Math.exp(-diffS) * share);
  for (let i = 0; i < gUs; i++) { f.us++; f.log.push(`${randInt(minuteFrom + 1, minuteTo - 1)}'. Tor für euch durch einen Mitspieler – ${f.us}:${f.them}!`); }
  for (let i = 0; i < gThem; i++) { f.them++; f.log.push(`${randInt(minuteFrom + 1, minuteTo - 1)}'. Gegentor durch ${f.opp} – ${f.us}:${f.them}.`); }
}

function nextFinalScene() {
  const f = S.finals[0];
  const from = f.scene === 0 ? 0 : FINAL_MINUTES[f.scene - 1];
  simChunk(f, from, FINAL_MINUTES[f.scene]);
  const sc = pick(SCENES[POSITIONS[S.player.pos].group])(quality());
  f.current = { situation: sc.situation, options: sc.options.map(o => ({ ...o, p: o.p !== undefined ? clamp(o.p - 0.05, 0.05, 0.9) : undefined })), result: null };
}

// Tore und Vorlagen im Finale zählen nachträglich zur Saison bzw. zur Nationalmannschaft
function finalStat(f, key) {
  if (f.kind === 'nation') { if (key === 'goals') S.player.intGoals++; return; }
  const res = S.seasonEnd, h = S.history[S.history.length - 1];
  res[key]++;
  if (h) h[key]++;
}

function playFinalOption(i) {
  const f = S.finals[0], c = f.current, o = c.options[i];
  const q = quality();
  let text;
  const minute = FINAL_MINUTES[f.scene];
  if (o.kind === 'shoot') {
    const ok = chance(0.75 + q * 0.1);
    if (ok) { f.us++; text = `TOOOR! Du verwandelst den Elfmeter ${o.label.toLowerCase()}!${celebrationText()}`; finalStat(f, 'goals'); queueFx('goal'); }
    else text = 'Der Torwart hält deinen Elfmeter!';
  } else if (o.kind === 'save') {
    const ok = chance(0.3 + q * 0.15);
    if (ok) text = 'GEHALTEN! Du ahnst die Ecke!';
    else { f.them++; text = 'Der Elfmeter ist drin.'; }
  } else {
    const ok = chance(o.p);
    if (o.kind === 'goal') {
      if (ok) { f.us++; finalStat(f, 'goals'); text = `TOOOR! ${o.okText || 'Du triffst!'}${celebrationText()}`; queueFx('goal'); }
      else text = o.failText || 'Knapp vorbei!';
    } else if (o.kind === 'assist') {
      if (ok) { f.us++; finalStat(f, 'assists'); text = o.okText || 'Perfekter Pass – Tor!'; queueFx('goal'); }
      else text = o.failText || 'Der Pass kommt nicht an.';
    } else if (o.kind === 'foul') {
      text = ok ? 'Gelbe Karte, aber der Konter ist gestoppt.' : 'Rote Karte! Ihr müsst in Unterzahl weiterspielen.';
      if (!ok) f.ownStr -= 4;
    } else {
      if (ok) text = o.okText || 'Gefahr gebannt!';
      else { f.them++; text = o.failText || 'Gegentor.'; }
    }
  }
  f.log.push(`${minute}'. ${o.label}: ${text.replace(/<[^>]+>/g, '')} (${f.us}:${f.them})`);
  c.result = text;
}

function continueFinal() {
  const f = S.finals[0];
  f.scene++;
  f.current = null;
  if (f.scene < FINAL_MINUTES.length) { nextFinalScene(); return; }
  simChunk(f, FINAL_MINUTES[FINAL_MINUTES.length - 1], 90);
  f.done = true;
  const res = S.seasonEnd;
  if (f.us > f.them) {
    grantFinalTitle(f, `Finale gegen ${f.opp} mit ${f.us}:${f.them} gewonnen`);
    f.verdict = `🏆 ${f.title}! Ihr gewinnt das Finale ${f.us}:${f.them}!`;
    setHeadline(f.kind === 'nation' ? `${lastName()} MACHT ${S.player.nation.toUpperCase()} ZUM ${f.title.split(' ')[0].toUpperCase()}!` : `FINAL-HELD ${lastName()}! ${f.title.toUpperCase()}!`);
  } else if (f.us < f.them) {
    f.verdict = `Ihr verliert das Finale ${f.us}:${f.them}. Bittere Tränen.`;
    res.lines.push(`Finale gegen ${f.opp} mit ${f.us}:${f.them} verloren.`);
    queueFx('sad');
  } else {
    f.verdict = `${f.us}:${f.them} nach 120 Minuten – es geht ins Elfmeterschießen!`;
    S.shootouts = S.shootouts || [];
    S.shootouts.push({ kind: f.kind, title: f.title, opp: f.opp, round: 0 });
  }
}

function finishFinal() {
  S.finals.shift();
  if (S.finals.length) { nextFinalScene(); return; }
  S.phase = S.shootouts && S.shootouts.length ? 'shootout' : 'seasonEnd';
}

function renderFinal() {
  const f = S.finals[0];
  if (!f.current && !f.done) nextFinalScene();
  const isCL = f.comp === 'Champions League';
  const home = f.kind === 'nation' ? S.player.nation : S.clubId;

// ---------- Drama am letzten Spieltag ----------
function finalDayDrama() {
  if (S.youth) return null;
  const L = clubLeague(S.clubId);
  const n = clubsIn(L.id).length;
  const rank = clubsIn(L.id).sort((a, b) => clubStr(b) - clubStr(a)).indexOf(S.clubId) + 1;
  const r = rank + randInt(-2, 2);
  if (L.id === PROMOTION.upper && r >= n - PROMOTION.count) return { type: 'relegation', text: '🔥 Abstiegskampf am letzten Spieltag! Nur ein Sieg rettet euch vor dem Abstieg. ' };
  if (L.id === PROMOTION.lower && r <= PROMOTION.count + 1) return { type: 'promotion', text: '🔥 Aufstiegsdrama am letzten Spieltag! Mit einem Sieg seid ihr in der Bundesliga. ' };
  if (r <= 2) return { type: 'title', text: '🔥 Meisterschaftsfinale am letzten Spieltag! Gewinnt ihr, seid ihr Meister. ' };
  return null;
}

// Ergebnis des letzten Spieltags in der Tabelle umsetzen
function applyDrama(rows) {
  const d = S.season.drama;
  if (!d || d.won === undefined) return;
  const n = rows.length;
  const idx = rows.findIndex(r => r.name === S.clubId);
  let target = idx;
  if (d.type === 'relegation') target = d.won ? Math.min(idx, n - PROMOTION.count - 1) : Math.max(idx, n - PROMOTION.count);
  if (d.type === 'promotion') target = d.won ? Math.min(idx, PROMOTION.count - 1) : Math.max(idx, PROMOTION.count);
  if (d.type === 'title') target = d.won ? 0 : Math.max(idx, 1);
  if (target === idx) return;
  const [row] = rows.splice(idx, 1);
  rows.splice(target, 0, row);
  rows.forEach((r, i) => { if (i < n - 1 && rows[i + 1].pts > r.pts) rows[i + 1].pts = r.pts; });
  if (target < idx) row.pts = Math.max(row.pts, (rows[target + 1] || row).pts + 1);
}

// ---------- Tagesherausforderung ----------
const DAILY_KEY = 'fussballkarriere-tageschallenge';
function dateKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function seeded(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
const DAILY_GOALS = [
  { id: 'title23', text: 'Gewinne bis zum Alter von 23 einen Titel', test: () => S.titles.length > 0 && S.player.age <= 24 },
  { id: 'goals150', text: 'Schieße in deiner Karriere 150 Tore', test: () => totals().goals >= 150 },
  { id: 'caps30', text: 'Bestreite 30 Länderspiele', test: () => S.player.caps >= 30 },
  { id: 'rating88', text: 'Erreiche Stärke 88', test: () => S.peak >= 88 },
  { id: 'cl', text: 'Gewinne die Champions League', test: () => S.titles.some(t => t.startsWith('Champions-League-Sieger')) },
  { id: 'money50', text: 'Besitze 50 Mio. €', test: () => S.money >= 50 },
  { id: 'clubs4', text: 'Spiele für 4 verschiedene Vereine und gewinne einen Titel', test: () => S.clubsPlayed.length >= 4 && S.titles.length > 0 },
];
function dailyChallenge() {
  const key = dateKey();
  const rnd = seeded(key);
  const pickR = arr => arr[Math.floor(rnd() * arr.length)];
  const nat = pickR(NATIONS.filter(n => n.str >= 72));
  const pos = pickR(Object.keys(POSITIONS));
  const allClubs = LEAGUES.flatMap(L => L.clubs.filter(([, s]) => s >= 60 && s <= 72).map(([n]) => n));
  return { date: key, nation: nat.name, pos, club: pickR(allClubs), goal: pickR(DAILY_GOALS) };
}
function dailyDone() { try { return (JSON.parse(localStorage.getItem(DAILY_KEY) || '{}'))[dateKey()]; } catch (e) { return false; } }
function startDaily() {
  const d = dailyChallenge();
  S = { phase: 'create', daily: d };
}
function applyDaily(daily) {
  S.daily = { date: daily.date, goalId: daily.goal.id, text: daily.goal.text, done: false };
  S.academyOffers = [daily.club];
}
function checkDaily() {
  if (!S || !S.daily || S.daily.done) return;
  const g = DAILY_GOALS.find(x => x.id === S.daily.goalId);
  if (!g || !g.test()) return;
  S.daily.done = true;
  try {
    const all = JSON.parse(localStorage.getItem(DAILY_KEY) || '{}');
    all[S.daily.date] = true;
    localStorage.setItem(DAILY_KEY, JSON.stringify(all));
  } catch (e) { /* ignorieren */ }
  toast(`🎯 Tagesherausforderung geschafft: ${S.daily.text}!`);
  queueFx('fanfare', 'confetti');
}
function renderDailyCard() {
  const d = dailyChallenge();
  return `
  <section class="card daily">
    <h2>🎯 Herausforderung des Tages</h2>
    <p><b>${esc(d.goal.text)}</b></p>
    <p class="muted">Start: ${esc(POSITIONS[d.pos].name)} aus ${esc(d.nation)} in der Jugend von ${esc(d.club)}. Jeden Tag gibt es eine neue Herausforderung.</p>
    ${dailyDone() ? '<p class="up">✅ Heute schon geschafft!</p>' : ''}

function animateRecap() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const target = parseFloat(el.dataset.count);

    const start = performance.now();
    const fmt = v => (dec ? v.toFixed(dec).replace('.', ',') : String(Math.round(v)));
    (function step(t) {
      const k = Math.min(1, (t - start) / 1100);
      el.textContent = fmt(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step); else el.textContent = fmt(target);
    })(start);
  });

}

// ---------- Schnellmodus ----------
function autoSeason() {
  if (focusOf() === 'recovery') S.player.form = clamp(S.player.form + 2, -10, 10);
  nextStep();
  let guard = 0;
  while (S.phase === 'season' && guard++ < 50) {
    const c = S.current;
    if (c.type === 'event') {
      const ev = EVENTS.find(e => e.id === c.id);
      const i = randInt(0, ev.options.length - 1);
      c.result = ev.options[i].run(); c.chosen = i;
      S.season.autoLog = S.season.autoLog || [];
      S.season.autoLog.push(`${ev.title}: ${ev.options[i].label}`);
    } else if (c.type === 'rehab') {
      while (!c.result) rehabStep(REHAB_CHOICES[1]);
    } else if (!c.result) {
      let best = 0;
      c.options.forEach((o, i) => { if ((o.p || 0.33) > (c.options[best].p || 0.33)) best = i; });
      resolveMatch(best);
    }
    S.season.step++; S.current = null; nextStep();
  }
}

  if (moments.length) {

    slides.push({

    });
  }
  const trophies = [...r.titles.map(t => `🏆 ${t}`), ...r.awards.map(a => `⭐ ${a}`)];
  slides.push(trophies.length
    ? { cls: 'trophy', fx: ['fanfare', 'confetti'], html: `<div class="rc-kicker">Titel & Auszeichnungen</div><ul class="rc-list big">${trophies.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` }
    : { cls: 'trophy', html: `<div class="rc-kicker">Titel</div><div class="rc-big small">Diesmal kein Pokal</div><div class="rc-sub">Nächste Saison greifst du wieder an!</div>` });
  if (S.headline) {
    slides.push({ cls: 'news', html: `<div class="newspaper rc-paper"><div class="paper">SPORT-EXPRESS · ${seasonLabel(r.year)}</div><div class="headline">${esc(S.headline)}</div></div>` });

  });

}

function openRecap() {
  closeRecap();
  const slides = recapSlides();
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = document.createElement('div');
  el.className = 'recap-overlay';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', 'Saison-Rückblick');
  el.innerHTML = `
    <div class="rc-bars">${slides.map(() => '<span><i></i></span>').join('')}</div>
    <button class="rc-close" type="button" aria-label="Rückblick schließen">✕</button>
    <div class="rc-stage"></div>
    <div class="rc-nav"><button class="rc-prev" type="button" aria-label="Zurück">‹</button><button class="rc-pause" type="button">${reduced ? '▶' : '❚❚'}</button><button class="rc-next" type="button" aria-label="Weiter">›</button></div>`;
  document.body.appendChild(el);
  recap = { el, slides, i: -1, timer: null, paused: reduced };
  el.querySelector('.rc-close').addEventListener('click', closeRecap);
  el.querySelector('.rc-next').addEventListener('click', () => showSlide(recap.i + 1));
  el.querySelector('.rc-prev').addEventListener('click', () => showSlide(Math.max(0, recap.i - 1)));
  el.querySelector('.rc-pause').addEventListener('click', togglePause);
  el.querySelector('.rc-stage').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    showSlide(e.clientX < rect.left + rect.width / 3 ? Math.max(0, recap.i - 1) : recap.i + 1);
  });
  document.addEventListener('keydown', recapKeys);
  showSlide(0);
}

function recapKeys(e) {
  if (!recap) return;
  if (e.key === 'Escape') closeRecap();
  else if (e.key === 'ArrowRight') showSlide(recap.i + 1);
  else if (e.key === 'ArrowLeft') showSlide(Math.max(0, recap.i - 1));
}

function showSlide(i) {
  if (!recap) return;
  if (i >= recap.slides.length) { closeRecap(); return; }
  clearTimeout(recap.timer);
  recap.i = i;
  const s = recap.slides[i];
  const stage = recap.el.querySelector('.rc-stage');
  stage.innerHTML = `<div class="rc-slide rcs-${s.cls}">${s.html}</div>`;
  recap.el.querySelectorAll('.rc-bars span').forEach((b, k) => {
    b.className = k < i ? 'done' : k === i ? (recap.paused ? 'now paused' : 'now') : '';
    b.style.setProperty('--dur', `${RECAP_MS}ms`);
  });
  stage.querySelectorAll('[data-rc]').forEach(n => {
    const target = parseInt(n.dataset.rc, 10);
    if (recap.paused) { n.textContent = target; return; }
    const start = performance.now();
    (function step(t) {
      const k = Math.min(1, (t - start) / 1200);
      n.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1 && recap) requestAnimationFrame(step);
    })(start);
  });
  if (s.fx) { queueFx(...s.fx); flushFx(); } else playSound(i === 0 ? 'whistle' : 'chime');
  if (!recap.paused) recap.timer = setTimeout(() => showSlide(i + 1), RECAP_MS);
}

function togglePause() {
  if (!recap) return;
  recap.paused = !recap.paused;
  recap.el.querySelector('.rc-pause').textContent = recap.paused ? '▶' : '❚❚';
  showSlide(recap.i);
}

function closeRecap() {
  if (!recap) return;
  clearTimeout(recap.timer);
  recap.el.remove();
  document.removeEventListener('keydown', recapKeys);
  recap = null;
}

</script>
